id: datacard_schema/src/genesis_datacard/schema/genesis_datacard.yaml
name: genesis_datacard
version: 2.0.0
description: >-
  A schema for representing datacards in the Genesis project.
  A datacard is a structured metadata document that describes a dataset:
  what it is, where it came from, who created it, how it can be accessed, and how it can be used. 
  Datacards serve both humans (who need to understand a dataset before using it) and machines (automated pipelines that ingest, catalog, and validate datasets).
  In Genesis, every dataset — regardless of size, sensitivity, or publication state — should have a datacard. 
  A datacard can be created at the same time as the dataset, or as early in the workflow as possible.

prefixes:
  linkml: https://w3id.org/linkml/
  genesis: https://example.org/genesis_datacard/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  spar_datacite: http://purl.org/spar/datacite/
  datacite_relations: https://datacite-metadata-schema.readthedocs.io/en/latest/appendices/appendix-1/relationType/#
  datacite_contributor: https://datacite-metadata-schema.readthedocs.io/en/latest/appendices/appendix-1/contributorType/#
  datacite_geo: https://datacite-metadata-schema.readthedocs.io/en/latest/properties/geolocation/#
  prov: http://www.w3.org/ns/prov#
  credit: https://credit.niso.org/contributor-roles/
  fair4ml: https://w3id.org/fair4ml#
  spdx: http://spdx.org/rdf/terms#

default_prefix: genesis
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:
# ---- Abstract base -------------------------------------------------------
  NamedThing:
    abstract: true
    description: "Abstract base class providing identity and human-readable metadata."
    slots:
      - name
      - description

  # ---- Top-level document container ----------------------------------------
  GenesisDatacardClass: 
    description: >-
      Top-level Genesis datacard document container.
      This is the root class for all datacard documents.
    tree_root: true
    attributes:
      xCard:
        description: "Metadata that describes the xCard"
        required: true
        range: XCardClass
    slots:
      - supports_discoverability
      - supports_accessibility
      - supports_interoperability
      - supports_reusability
      - supports_governed_use
      - supports_ai_usability
      - discoverability
      - accessibility
      - interoperability
      - reusability
      - governed_use
      - ai_usability
    slot_usage:
      supports_discoverability:
        required: true
      supports_accessibility:
        required: true
      supports_interoperability:
        required: true
      supports_reusability:
        required: true
      supports_governed_use:
        required: true
      supports_ai_usability:
        required: true
      discoverability:
        required: true
      accessibility:
        required: false
      interoperability:
        required: false
      reusability:
        required: false
      governed_use:
        required: false
      ai_usability:
        required: false
    rules:
      - description: "If supports_accessibility is Yes, then accessibility must be present."
        preconditions:
          slot_conditions:
            supports_accessibility:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            accessibility:
              value_presence: PRESENT
      - description: >-
          If supports_interoperability is "Yes", then interoperability must be present."
        preconditions:
          slot_conditions:
            supports_interoperability:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            interoperability:
              value_presence: PRESENT
      - description: >-
          If supports_reusability is "Yes", then reusability must be present."
        preconditions:
          slot_conditions:
            supports_reusability:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            reusability:
              value_presence: PRESENT
      - description: >-
          If supports_governed_use is "Yes", then governed_use must be present."
        preconditions:
          slot_conditions:
            supports_governed_use:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            governed_use:
              value_presence: PRESENT
      - description: >-
          If supports_ai_usability is "Yes", then ai_usability must be present."
        preconditions:
          slot_conditions:
            supports_ai_usability:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            ai_usability:
              value_presence: PRESENT
  
  XCardClass:
    description: >-
      Metadata that describes the xCard: "dataset" for all Genesis data cards.
    attributes:
      card_type:
        required: true
        range: string
        equals_string: dataset
        in_subset:
          - required

  DiscoverabilityClass:
    description: >-
      Metadata elements that enhance the discoverability of this datacard and dataset, 
      such as identification, categorization, release status, contacts, authors, sensitivity and workflow information.
    slots:
      - datacard
      - identification
      - dataset_description
      - product_type
      - dataset_type
      - release_status
      - dataset_publisher
      - contact
      - additional_contacts
      - authors
      - contributors
      - sponsor_organizations
      - sponsoring_doe_program_office
      - sponsoring_doe_subprogram
      - research_organizations
      - facilities
      - sensitivity      
      - workflow
    slot_usage:
      datacard:
        required: true
      identification:
        required: true
      dataset_description:
        required: true
      product_type:
        required: true
      release_status:
        required: true
      dataset_publisher:
        required: false
      contact:
        required: true
      additional_contacts:
        required: false
      sponsor_organizations:
        required: true
      sponsoring_doe_program_office:
        required: false
      sponsoring_doe_subprogram:
        required: false
      research_organizations:
        required: true
      facilities:
        required: false
      sensitivity:
        required: true
        description: >-
          Sensitivity of the DATASET, which may differ from the sensitivity of the data card. 
          Populate based on the sensitivity of the dataset alone, not the data card. 
          See NOTE ON SENSITIVITY above. 
          NOTE: Sensitivity terminology is still under Genesis governance review. Vocabulary may evolve.
      workflow:
        required: true
      authors:
        required: true
      contributors:
        required: false
    rules:
      - description: "At least one author is required when release_status = Approved"
        preconditions:
          slot_conditions:
            release_status:
                equals_string: Approved
        postconditions:
          slot_conditions:
            authors:
              required: true
      - description: "At least one author is required when release_status = Published."
        preconditions:
          slot_conditions:
            release_status:
                equals_string: Published
        postconditions:
          slot_conditions:
            authors:
              required: true
      - description: "publisher is required when release_status = Approved."
        preconditions:
          slot_conditions:
            release_status:
                equals_string: Approved
        postconditions:
          slot_conditions:
            dataset_publisher:
              required: true
      - description: "publisher is required when release_status = Published."
        preconditions:
          slot_conditions:
            release_status:
                equals_string: Published
        postconditions:
          slot_conditions:
            dataset_publisher:
              required: true

  AccessibilityClass:
    description: >-
      Metadata elements that describe the accessibility of this dataset, 
      such as access policy, and dataset scale information.
      This is important for users to understand how they can access the dataset and any restrictions that may apply.
    slots:
      - access_policy
      - access
      - dataset_scale
    slot_usage:
      access_policy:
        required: true
      access:
        required: true

  InteroperabilityClass:
    description: >-
      Metadata elements that describe the interoperability of this dataset, 
      such as context of data collection, data structure, provenance, related resource, schema, and integrity.
      This is important for users to understand how they can use the dataset and what tools or software they may need to work with it.
    slots:
      - data_structure
      - provenance
      - dates
      - semantic_layer
      - related_resources
      - domain_metadata
    slot_usage:
      data_structure:
        required: true
      provenance:
        required: true
      dates:
        required: false
      semantic_layer:
        required: false
      related_resources:
        required: false
      domain_metadata:
        required: false

  ReusabilityClass:
    description: >-
      Metadata elements that describe the reusability of this dataset, 
      such as license and rights, stewardship, data quality, integrity, and citation information.
    slots:
      - license
      - additional_licenses
      - stewardship
      - data_quality
      - citation
      - integrity
    slot_usage:
      license:
        required: false
      additional_licenses:
        required: false
      stewardship:
        required: false
      data_quality:
        required: true
      citation:
        required: false
      integrity:
        required: true
  
  GovernedUseClass:
    description: >-
      Metadata elements that describe the governed use of this dataset, 
      such as compliance information, use governance, and review history.
      This is important for users to understand any compliance requirements, restrictions, or governance processes that apply to the dataset, as well as the history of any formal reviews it has undergone.
    slots:
      - use_governance
      - non_sensitivity_governance_metadata
      - compliance
      - review_provenance_companion
    slot_usage:
      use_governance:
        required: true
      non_sensitivity_governance_metadata:
        required: true
      compliance:
        required: true
      review_provenance_companion:
        required: false
        recommended: true
  
  AIUsabilityClass:
    description: >-
      Metadata elements that describe the usability of this dataset for AI applications, 
      such as suitability for training, evaluation, or inference, and any relevant characteristics that may affect its use in AI contexts.
      This is important for users who are specifically interested in using the dataset for AI applications, as it provides information about how well-suited the dataset is for those purposes and any considerations they should keep in mind.
    slots:
      - ai_usage
    slot_usage:
      ai_usage:
        required: true

  DataCardClass:
    abstract: false
    description: >-
      Datacard Metadata. This class captures the core metadata elements that describe
      the document itself, not the dataset. It includes information such as
      the datacard's version, overall sensitivity, source marking, the creation of the datacard,
      and a change log for tracking updates to the datacard over time.
    slots:
      - template_version
      - datacard_version
      - filename
      - language
      - id
      - sensitivity
      - creation_method
      - created_date
      - updated_date
      - change_log
      - created_by
    slot_usage:
      sensitivity:
        required: true
        description: >-
          Sensitivity of the DATA CARD itself, which may differ from the sensitivity of the dataset 
          it describes. Populate based on the sensitivity of the data card content alone, 
          not the dataset. See NOTE ON SENSITIVITY above.
          NOTE: Sensitivity terminology is still under Genesis governance review. Vocabulary may evolve.

  PublicationIdentifierClass:
    description: >-
      A section of metadata elements that provide a collection of publication identifiers.
    slots:
      - value
      - type
      - relationship
    slot_usage:
      value:
        required: true
        identifier: true
      type:
        range: IdentifierTypeEnum
        required: true
        in_subset:
          - if_applicable
        recommended: true
        identifier: false
      relationship:
        required: true
  
  IdentifierClass:
    description: "A unique identifier for an entity, following a specific format (e.g., DOI, UUID)."
    slots:
      - type
      - value
    slot_usage:
      type:
        description: "The type of the identifier (e.g., DOI, UUID)."
        range: IdentifierTypeEnum
        in_subset:
          - if_applicable
        recommended: true
      value:
        description: "The value of the identifier, following the format specified by the 'type' field."
        in_subset:
          - if_applicable
        recommended: true
    rules:
      - description: "If type is present, value must also be present."
        preconditions:
          slot_conditions:
            type:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
      - description: "If value is present, type must also be present."
        preconditions:
          slot_conditions:
            value:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            type:
              value_presence: PRESENT
  
  ChangeLogEntryClass:
    description: "An individual entry in the change log, documenting a specific change to the datacard."
    slots:
      - change_date
      - datacard_version
      - summary
    slot_usage:
      change_date:
        identifier: true
        required: true
      datacard_version:
        required: true
        description: >-
          Replace default value with the version of the updated version, 
          which should be incremented when the datacard is meaningfully updated. 
          Use semantic versioning: MAJOR.MINOR.PATCH e.g., 1.0 → 1.1 for content updates; 
          1.x -> 2.0 for structural changes.
      summary:
        required: true
  
  CreatorClass:
    description: "An individual, organization, AI model, or software tool that created or updated the datacard or dataset."
    slots:
      - contribution_date
      - description
      - creator
    slot_usage:
      contribution_date:
        description: "The ISO 8601 date of this specific contribution"
        identifier: true
        required: true
      creator:
        range: AgentClass
        description: "Container for the agent (person, organization, AI model, or software tool) responsible for this contribution."
        required: true
  
  MaintainerAgentClass:
    description: >-
      An individual, organization, AI model, or software tool responsible for 
      maintaining the datacard or dataset.
    slots:
      - person
      - organization
    slot_usage:
      person:
        multivalued: false
      organization:
        multivalued: false
    rules:
    - description: If person is present, organization must be absent
      preconditions:
        slot_conditions:
          person:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          organization:
            value_presence: ABSENT
    - description: If organization is present, person must be absent
      preconditions:
        slot_conditions:
          organization:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          person:
            value_presence: ABSENT
  
  AgentClass:
    description: >-
      An individual, organization, AI model, or software tool that
      created the datacard or dataset in the role indicated.
      AgentClass rules indicate that the selected slot must be filled in based on the agent_type, and
      the other three must be left blank.
      This allows for flexibility in representing different types of contributors
      while maintaining clear rules for which fields to use.
    slots:
      - person
      - organization
      - ai_model
      - software
    slot_usage:
      person:
        multivalued: false
      organization:
        multivalued: false
      ai_model:
        multivalued: false
      software:
        multivalued: false
        inlined: true
        inlined_as_list: false
    rules:
    - description: If person is present, organization must be absent
      preconditions:
        slot_conditions:
          person:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          organization:
            value_presence: ABSENT
    - description: If person is present, ai_model must be absent
      preconditions:
        slot_conditions:
          person:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_model:
            value_presence: ABSENT
    - description: If person is present, the software must be absent
      preconditions:
        slot_conditions:
          person:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          software:
            value_presence: ABSENT
    - description: If organization is present, person must be absent
      preconditions:
        slot_conditions:
          organization:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          person:
            value_presence: ABSENT
    - description: If organization is present, ai_model must be absent
      preconditions:
        slot_conditions:
          organization:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_model:
            value_presence: ABSENT
    - description: If organization is present, software must be absent
      preconditions:
        slot_conditions:
          organization:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          software:
            value_presence: ABSENT
    - description: If ai_model is present, person must be absent
      preconditions:
        slot_conditions:
          ai_model:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          person:
            value_presence: ABSENT
    - description: If ai_model is present, organization must be absent
      preconditions:
        slot_conditions:
          ai_model:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          organization:
            value_presence: ABSENT
    - description: If ai_model is present, software must be absent
      preconditions:
        slot_conditions:
          ai_model:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          software:
            value_presence: ABSENT
    - description: If software is present, person must be absent
      preconditions:
        slot_conditions:
          software:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          person:
            value_presence: ABSENT
    - description: If software is present, organization must be absent
      preconditions:
        slot_conditions:
          software:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          organization:
            value_presence: ABSENT
    - description: If software is present, ai_model must be absent
      preconditions:
        slot_conditions:
          software:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_model:
            value_presence: ABSENT
  
  PersonClass:
    description: "A human individual."
    slots:
      - given_name
      - family_name
      - orcid
      - email
      - affiliation
      - role
    slot_usage:
      role:
        required: false
        in_subset:
          - situational_required
      orcid:
        recommended: true
  
  AffiliationClass:
    description: "An organization with which an entity is affiliated."
    slots:
      - name
      - ror_id
    slot_usage:
      name:
        required: true
        in_subset:
          - situational_required
      ror_id:
        in_subset:
          - if_applicable
        recommended: true

  OrganizationClass:
    description: "An organization or group of individuals."
    slots:
      - name
      - ror_id
      - role
    slot_usage:
      name:
        required: true
        in_subset:
          - situational_required
      role:
        required: false

  ResearchOrganizationClass:
    is_a: OrganizationClass
    description: >-
      An organization that conducted research or provided resources for the dataset.
      This describes the organizations that conducted research or provided resources for the dataset, 
      which is important for acknowledging contributions and understanding potential conflicts of interest.
    slot_usage:
      ror_id:
        description: "The ROR ID of the research organization, if available. E.g., https://ror.org/02vwzrd76"
      role:
        required: false
        in_subset:
          - discoverability_if_applicable
  
  FacilityClass:
    is_a: OrganizationClass
    description: >-
      A facility where research was conducted or resources were provided for the dataset.
      This describes the facilities where research was conducted or resources were provided for the dataset, 
      which is important for acknowledging contributions and understanding potential conflicts of interest.
    slots:
      - location
    slot_usage:
      ror_id:
        description: "The ROR ID of the facility, if available. E.g., https://ror.org/02vwzrd76"

  LocationClass:
    description: "A physical location associated with a facility or organization."
    slots:
      - description
      - ror_id
    slot_usage:
      description:
        required: true
      ror_id:
        description: "The ROR ID of the location, if available. E.g., https://ror.org/02vwzrd76"
  
  AIModelClass:
    description: "An AI model, including its name, version, and provider."
    slots:
      - name
      - version
      - accessed_date
      - identifier
      - role
      - relationship
    slot_usage:
      name:
        in_subset:
          - situational_required
      version:
        description: "Replace default with the version of the AI model, if applicable."
        in_subset:
          - if_applicable
        recommended: true
      accessed_date:
        description: "The ISO 8601 date when the AI model was accessed for use in creating or updating the datacard."
        required: true
        in_subset:
          - situational_required
      relationship:
        description: "The relationship of this AI model to the datacard or dataset"
        range: RelationshipTypeEnum
        required: true
        in_subset:
          - situational_required
  
  SoftwareClass:
    description: "A software tool, including its name, version, and provider."
    slots:
      - name
      - version
      - identifier
      - role
      - relationship
    slot_usage:
      name:
        in_subset:
          - situational_required
      version:
        in_subset:
          - if_applicable
        recommended: true
        description: "Replace default with the version of the software tool, if applicable."
      relationship:
        description: "The relationship of this software to the datacard or dataset."
        range: RelationshipTypeEnum
        required: true
        in_subset:
          - situational_required
      role:
        required: false
        in_subset:
          - situational_required
  
  DomainMetadataClass:
    is_a: NamedThing
    description: >-
      Domain-specific metadata relevant to the dataset, 
      which may include specific fields or structures relevant to the scientific domain of the dataset.
    slots:
      - science_domain
      - schema_reference
      - fields

  SchemaReferenceClass:
    is_a: IdentifierClass
    description: >-
      A reference to a schema that describes the structure of the dataset or domain metadata.
      This can include links to formal schema definitions, data dictionaries, or other structured representations of the dataset's content.
    slots:
      - version

  DomainMetadataFieldValueClass:
    description: A domain-specific metadata value keyed by the field name.
    slots:
      - name
      - field_value
      - data_type
      - unit
      - description
    slot_usage:
      name:
        required: true
        in_subset:
          - situational_required
      field_value:
        required: true
        in_subset:
          - situational_required
      data_type:
        required: false
        in_subset:
          - situational_required
      unit:
        required: false
        in_subset:
          - situational_required
      description:
        required: false
        description: "A detailed description of the domain-specific metadata field."
        in_subset:
          - if_applicable

  DatasetIdentificationClass:
    description: "A section of metadata elements that identify and provide basic information about the dataset."
    slots:
      - name
      - project
      - version
      - primary_id
      - additional_ids
      - supersedes
      - superseded_by
      - parent_collection
    slot_usage:
      project:
        ifabsent: string(genesis)
      version:
        required: true
        ifabsent: string(1.0.0)
        in_subset:
          - discoverability_required
        description: >-
          Dataset version using semantic versioning: MAJOR.MINOR.PATCH
          Increment MAJOR for breaking changes, MINOR for additions,
          PATCH for corrections. Start at 1.0.0 for first release.
          See supersedes / superseded_by below for linking versions,
          and stewardship.versioning_strategy for how versions are managed.

  NamedIdentifierClass:
    description: "A named identifier for an entity, consisting of a name, and an Identifier class for the value."
    slots:
      - name
      - identifier
    slot_usage:
      name:
        required: true

  DatasetDescriptionClass:
    description: >-
      A section of metadata elements that describe the dataset, 
      including its content, context, and characteristics.
      At a minimum, a summary is required to provide a brief overview of the dataset, 
      even for early-stage datasets that are still in development 
      and may not have all details finalized. 
      This allows for the creation of datacards early in the workflow, 
      which can be updated as more information becomes available.
    slots:
      - science_domain
      - dataset_summary
      - purpose
      - collection_methodology
      - data_characteristics
      - limitations
      - tags
      - task_category
      - task_subcategory
      - keywords
    rules:
      - description: "If task_subcategory is present, then task_category must be present."
        preconditions:
          slot_conditions:
            task_subcategory:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            task_category:
              value_presence: PRESENT

  UseGovernanceClass:
    description: >-
      Information to guide appropriate use and prevent misuse of this dataset.
      This section provides guidance on the intended use of the dataset, 
      any permitted uses, and any restrictions or limitations on how the dataset can be used. 
      This is important for ensuring that users understand the appropriate contexts for using the dataset and any potential risks or ethical considerations associated with its use.
    slots:
      - current_use
      - intended_use
      - permitted_use
      - out_of_scope_use
      - prohibited_use

  SensitivityClass:
    description: >-
      Sensitivity metadata for Genesis assets. This structure is intended to preserve
      authoritative source markings/designations while minimizing redundant manual entry.
      It separates actual source marking/control information from adjacent governance
      metadata such as export control, privacy, rights, release, and records status.
      Design_principles:
      Preserve authoritative source markings/designations as primary source of truth.
      Use one overall sensitivity summary field for display/discovery, but not as the sole governance basis.
      Keep UCNI distinct from generic CUI
      Treat OUO and other deprecated labels as legacy provenance, not modern primary control categories.
      Keep export, privacy/PII/PHI, rights, agreement, release, and records metadata outside the sensitivity block.
      Do not create or imply a Genesis-private marking scheme.
      Prefer structured canonical fields plus a preserved source marking string over many overlapping flags.
      Support source-agency-aware controls where non-DOE-originated material is in scope.
    slots:
      - overall_sensitivity
      - source_marking_string
      - source_marking_scheme
      - classified_status
      - classification_level
      - classification_category
      - classified_control_markings
      - cui_status
      - cui_basic_categories
      - cui_specified_categories
      - cui_limited_dissemination_controls
      - ucni_status
      - uk_mda_status
      - legacy_label_source
      - normalized_control_basis
    slot_usage:
      overall_sensitivity:
        required: true
      source_marking_string:
        required: true
      source_marking_scheme:
        required: true
      classified_status:
        required: true
      cui_status:
        required: true
      ucni_status:
        required: true
    rules:
      - description: >-
          If classified_status = "Yes", classification level is required.
        preconditions:
          slot_conditions:
            classified_status:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            classification_level:
              value_presence: PRESENT
      - description: >-
          If classified_status = "Yes", classification_category must contain at least one value.
        preconditions:
          slot_conditions:
            classified_status:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            classification_category:
              value_presence: PRESENT              
      - description: >-
          If ucni_status = "Yes", UCNI must not be represented solely through generic CUI category fields.
        preconditions:
          slot_conditions:
            ucni_status: 
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            cui_specified_categories:
              value_presence: PRESENT
      - description: >-
          If source_marking_scheme = "Legacy_OUO", legacy_label_source should be populated.
        preconditions:
          slot_conditions:
            source_marking_scheme:
              equals_string: "Legacy_OUO"
        postconditions:
          slot_conditions:
            legacy_label_source:
              value_presence: PRESENT
      - description: >-
          If source_marking_scheme = "Legacy_OUO" and current basis has not been resolved,
            normalized_control_basis should be present
        preconditions:
          slot_conditions:
            source_marking_scheme:
              equals_string: "Legacy_OUO"
        postconditions:
          slot_conditions:
            normalized_control_basis:
              value_presence: PRESENT
      - description: >-
          If the overall_sensitivity is Classified, then the classified_status must be "Yes".
        preconditions:
          slot_conditions:
            overall_sensitivity:
              equals_string: "Classified"
        postconditions:
          slot_conditions:
            classified_status:
              equals_string: "Yes"
      - description: >-
          If the overall_sensitivity is CUI, then the cui_status must be "Yes" and classified_status must be "No".
        preconditions:
          slot_conditions:
            overall_sensitivity:
              equals_string: "CUI"
        postconditions:
          slot_conditions:
            cui_status:
              equals_string: "Yes"
            classified_status:
              equals_string: "No"
      - description: >-
          If the overall_sensitivity is UCNI then the ucni_status must be "Yes".
        preconditions:
          slot_conditions:
            overall_sensitivity:
              equals_string: "UCNI"
        postconditions:
          slot_conditions:
            ucni_status:
              equals_string: "Yes"
 
  WorkflowClass:
    description: >-
      Workflow & Lifecycle:
      Describes the technical and processing lifecycle position
      of the dataset. See NOTE ON WORKFLOW STATE vs. RELEASE STATUS
      in the header for expected alignment with release_status.
    slots:
      - state
      - is_intermediate
      - pipeline_stage
      - embargo_until
    slot_usage:
      state:
        range: StateEnum
        required: true
    rules:
      - description: "If state is Published, then embargo_until must be absent."
        preconditions:
          slot_conditions:
            state:
              equals_string: "Published"
        postconditions:
          slot_conditions:
            embargo_until:
              value_presence: ABSENT
      - description: "If state is Embargo, then embargo_until must be present."
        preconditions:
          slot_conditions:
            state:
              equals_string: "Embargo"
        postconditions:
          slot_conditions:
            embargo_until:
              value_presence: PRESENT

  AccessPolicyClass:
    description: >-
      Access policy for the dataset.
      Describes the access level and any restrictions or requirements for accessing the dataset,
      which is critical information for users to understand how they can access the dataset and any potential barriers to access. 
      Access policy is DISTINCT from sensitivity,
      which describes the nature of the data and its potential risks) 
      and from release status (which describes the publication state of the dataset).
      access_policy.access_level is a required field that indicates the level of permissions required for users to access the dataset, following AccessLevelEnum.
      
      open: no additional permissions required beyond standard account registration and agreement to terms of service. This indicates that the dataset is freely accessible to the public and can be used without any special permissions or restrictions. Note that "open" does not necessarily mean that the dataset is free of copyright or other legal restrictions, but rather that there are no additional access controls in place. Users may still need to comply with any applicable laws or regulations when using the dataset.
      
      restricted: access may be granted to users who meet certain criteria, such as being part of a specific research community, having a legitimate research purpose, or agreeing to specific terms and conditions. This indicates that the dataset is not freely accessible to the public and that users must meet certain requirements or restrictions in order to access it. The specific criteria for access may vary depending on the dataset and the organization providing it, but could include things like institutional affiliation, research purpose, or agreement to specific terms and conditions.
      
      controlled: access is tightly controlled and may require specific authorization, agreements, or approvals. This indicates that the dataset contains sensitive information and that only authorized users can access it.
    slots:
      - access_level
      - access_restrictions
      - authorization_required
      - intended_partner_classes
      - approved_environments
      - policy_url
      - policy_text
    rules:
      - description: "If access_level is Restricted, authorization_required must be present."
        preconditions:
          slot_conditions:
            access_level:
              equals_string: "Restricted"
        postconditions:
          slot_conditions:
            authorization_required:
              value_presence: PRESENT
      - description: "If access_level is Controlled, authorization_required must be present."
        preconditions:
          slot_conditions:
            access_level:
              equals_string: "Controlled"
        postconditions:
          slot_conditions:
            authorization_required:
              value_presence: PRESENT
      - description: >-
          If authorization_required includes "Other", then access_restrictions must be present.
        preconditions:
          slot_conditions:
            authorization_required:
              has_member:
                equals_string: "Other"
        postconditions:
          slot_conditions:
            access_restrictions:
              value_presence: PRESENT

  LicenseClass:
    description: >-      
      License information for the dataset. 
      This describes the legal terms under which the dataset can be used, 
      which is critical for users to understand their rights and obligations when using the dataset.
      Strongly recommended when release_status = Approved | Published.
      Use "pending" if not yet assigned.
    slots:
      - spdx_id
      - name
      - url
      - known_contractual_rights
    slot_usage:
      name:
        required: false
        pattern: ^.{3,}$
        description: "The human-readable name of the license."
        in_subset:
          - reusability_if_applicable
    rules:
      - description: "If spdx_id is Other, then name must be present and populated with the license name."
        preconditions:
          slot_conditions:
            spdx_id:
              equals_string: Other
        postconditions:
          slot_conditions:
            name:
              value_presence: PRESENT
              
  PublisherClass:
    is_a: NamedThing
    description: >-
      The publisher of the dataset, which may be an individual, organization, or other entity responsible for making the dataset available to users.
      This describes the publisher of the dataset, which is important for acknowledging contributions and providing contact information for users who may have questions or need support when using the dataset.
    slots:
      - ror_id
  
  ContactClass:
    description: >-
      Primary point of contact for questions about this dataset. 
      This describes who to contact for questions about the dataset, 
      which is important for users who may need additional information or support when using the dataset.
      A contact is required for all datasets, regardless of sensitivity or release status.
    slots:
      - person
      - organization
      - valid_until
      - succession_note
    rules:
      - description: If person is absent, organization must be present
        preconditions:
          slot_conditions:
            person:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            organization:
              value_presence: PRESENT
      - description: If organization is absent, person must be present
        preconditions:
          slot_conditions:
            organization:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            person:
              value_presence: PRESENT

  
  SponsorOrganizationClass:
    description: >-
      An organization that funded or sponsored the creation of the dataset.
      This describes the organizations that provided financial or other support for the creation of the dataset.
    slots:
      - name
      - ror_id
      - award_number
      - funding_source
      - program
    slot_usage:
      name:
        description: "The name of the sponsoring organization. E.g., DOE Office of Science | NNSA | NSF"
        in_subset:
          - discoverability_required
      ror_id:
        description: "The ROR ID of the sponsoring organization, if available. E.g., https://ror.org/02vwzrd76"
        in_subset:
          - discoverability_if_applicable
  
  TagsClass:
    description: "Structured tags for catalog filtering and discovery."
    slots:
      - project
      - science
      - object_type
    slot_usage:
      object_type:
        description: "The type of object described by this datacard."
      project:
        required: true
        in_subset:
          - situational_required
  
  DataStructureClass:
    description: >-
      Dataset Characteristics: Describes the content and characteristics of the 
      dataset, including its scale, format, features, modalities, 
      and other relevant details that help users understand what the dataset contains and how it might be used.
    slots:
      - formats
      - encoding
      - schema_version
      - modalities
      - features
      - splits
      - language
      - spatial_coverage
      - temporal_coverage
    slot_usage:
      formats:
        multivalued: true
        required: true
        in_subset:
          - interoperability_required
      language:
        required: false
        description: "The language(s) represented in the dataset, using the ISO 639-1 language codes. E.g., en | es | fr | zh"  
        in_subset:
            - interoperability_if_applicable

  FeatureClass:
    is_a: NamedThing
    description: "A specific feature or variable included in the dataset, including its name, description, and data type."
    slots:
      - name
      - data_type
      - unit
      - range
    slot_usage:
      name:
        description: "The name of the feature or variable."
  
  SpatialCoverageClass:
    description: >-
      Geographic coverage of the dataset.
      Use for geospatial datasets or facility-based experiments.
    slots:
      - description
      - geo_location_box
    slot_usage:
      description:
        description: "Detailed description of the spatial coverage."
        exact_mappings:
          - datacite_geo:geoLocationPlace
  
  GeoLocationBoxClass:
    description: "WGS84 decimal degrees; use for area coverage."
    slots:
      - west_bound_longitude
      - east_bound_longitude
      - south_bound_latitude
      - north_bound_latitude

  TemporalCoverageClass:
    description: >-
      Time period the dataset content represents.
      NOTE: distinct from dates.data_collection_start/end, which describe
      **when** collection occurred. 
      Use temporal_coverage when the dataset content represents a specific time period 
      (e.g., satellite imagery from June 2020),
      and use data_collection_start/end when the dataset 
      was collected over a specific time period but the content is not tied to that period 
      (e.g., a dataset of scientific articles collected from 2015-2020).
    slots:
      - start_date
      - end_date
      - description
    slot_usage:
      description:
        description: "Detailed description of the temporal coverage."
        in_subset:
          - interoperability_if_applicable

  DatasetScaleClass:
    description: >-
      The scale of the dataset, including the number (and units) of records, bytes (compressed and uncompressed).
    slots:
      - record_count
      - record_unit
      - compressed_bytes
      - uncompressed_bytes
  
  DatesClass:
    description: >-
      Important dates related to the dataset, such as when it was collected, issued, or modified.
      This helps users understand the timeline of the dataset and its relevance to their needs.
    slots:
      - data_collection_start
      - data_collection_end
      - issued
      - modified

  AccessClass:
    description: >-
      Complete the fields you know at the time of datacard creation.
      Repository-assigned fields (landing pages, accession numbers,
      access protocols) will be populated by the managing repository
      or catalog system at ingest.
    slots:
      - current_location
      - publicly_facing_landing_page_url
      - intended_repositories
  
  IntendedRepositoryClass:
    description: >-
      A repositories you intend to deposit or have deposited this dataset in. 
      The managing repository or catalog system will
      resolve and populate repository-assigned fields at ingest.
      Repositories may be institutional, project-owned, community, or national 
      (e.g., OSTI, Zenodo, institutional data repository, project data store).
    slots:
      - name
      - access_level
      - is_primary
      - date_deposited
      - data_services
    slot_usage:
      name:
        range: string
        required: true
        identifier: false

  DataServiceClass:
    description: "Class/block to populate if a Data Service / API endpoint exists for this dataset."
    slots:
      - name
      - endpoint
      - documentation_url
      - authentication
      - version
      - rate_limit
    slot_usage:
      name:
        description: "The name of the data service or API endpoint."
        close_mappings:
          - dcat:accessService
        examples:
          - value: "REST API"
          - value: "GraphQL endpoint"
  
  ProvenanceClass:
    description: >-
      Provenance information about the dataset, including its origin, history, and any transformations/processing it has undergone.
      Describes how this dataset was created, what it was derived from, and what processing was applied.
      This helps users understand the lineage of the dataset and assess its reliability and suitability 
      for their needs, and can facilitate reuse and reproducibility.
    slots:
      - was_generated_by
      - source_data
      - processing_steps
      - instrumentation
      - simulation_details
      - software_environment

  DatasetClass:
    is_a: NamedThing
    description: "A dataset that is available for use."
    slots:
      - identifier
      - relationship
    exact_mappings:
      - dcat:Dataset

  SourceDatasetClass:
    is_a: DatasetClass
    description: >-
      A source dataset that the dataset described in this datacard was derived from, 
      including its identifier and relationship to the current dataset.
    slot_usage:
      name:
        description: "The name of the source dataset."
      relationship:
        description: "The relationship of the source dataset to the current dataset."

  SoftwareEnvironmentClass:
    description: >-
      Software environment used to generate or process this dataset. 
      Captures what is needed for computational reproducibility.
    slots:
      - os
      - compiler
      - container
      - hpc_environment
      - notes
  
  StewardshipClass:
    description: >-
      Stewardship & Versioning:
      This block describes how the dataset is stewarded and how its versioning is managed over time, 
      which is important for maintaining the dataset, tracking changes, and ensuring users can access the most up-to-date information.
      NOTE ON VERSIONING: Three fields work together to describe versioning:
      discoverability.identification.version        — the version number of this dataset
      discoverability.identification.supersedes /
      discoverability.identification.superseded_by  — links to prior and successor versions
      **reusability.stewardship.versioning_strategy — how versioning is managed over time**
    slots:
      - level
      - maintainer
      - update_frequency
      - retention_policy
      - versioning_strategy
    slot_usage:
      level:
        range: StewardshipLevelEnum
        description: 
          The stewardship level of the dataset from a controlled vocabulary, StewardshipLevelEnum, 
          indicating the management level of stewardship.
        in_subset:
          - reusability_if_applicable
      versioning_strategy:
        description: >-
          The strategy for managing dataset versions over time, such as semantic versioning, date-based versioning, or custom versioning schemes.
  
  NonSensitivityGovMetadataClass:
    description: >-
      Governance-relevant metadata that may affect sharing/use decisions but is not
      part of the source sensitivity/marking block itself.
    slots:
      - export_control
      - privacy
      - rights_release_records

  ExportControlClass:
    description: >-
      Export control information for the dataset, which describes any export control restrictions that apply to the dataset, 
      which is critical for users to understand any legal restrictions on sharing or using the dataset across international borders.
    slots:
      - export_control_status
      - export_control_basis
      - foreign_national_access_status
    slot_usage:
      export_control_status:
        required: true
      export_control_basis:
        required: false
        in_subset:
          - situational_required
      foreign_national_access_status:
        required: false
    rules:
      - description: >-
          If export_control_status = "Yes", export_control_basis is required. 
        preconditions:
          slot_conditions:
            export_control_status:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            export_control_basis:
              value_presence: PRESENT
          
  PrivacyClass:
    description: >-
      Privacy information for the dataset, which describes any privacy considerations or restrictions that apply to the dataset, 
      which is critical for users to understand any ethical or legal considerations related to the dataset, especially if it contains personally identifiable information (PII) or protected health information (PHI).
    slots:
      - privacy_status
      - pii_status
      - phi_status
      - privacy_control_basis
      - privacy_regime_notes
    slot_usage:
      privacy_status:
        required: true
      pii_status:
        required: true
      phi_status:
        required: false
      privacy_control_basis:
        required: false
      privacy_regime_notes:
        required: false

  RightsReleaseRecordsClass:
    description: >-
      Information about rights, release, and records status for the dataset, which describes any legal or
      administrative considerations related to the dataset, such as copyright status, release status, and records management status.
      This is important for users to understand any legal or administrative considerations related to the dataset,
      which may affect how the dataset can be used, shared, or cited.
    slots:
      - ip_restriction_type
      - agreement_required
      - agreement_type
      - public_release_status
      - record_status
    rules:
      - description: >-
          If agreement_required = "Yes", agreement_type must contain at least one value.
        preconditions:
          slot_conditions:
            agreement_required:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            agreement_type:
              value_presence: PRESENT
              required: true
              minimum_cardinality: 1

  SpecificReviewClass:
    description: "An individual review or quality assessment of the dataset."
    slots:
      - source_review_reference
      - review_purpose
      - source_review_authority
      - review_contact_name
      - review_contact_email
      - reviewed_by
      - decontrol_or_declassify_on
      - review_date
      - comments

  RelatedResourcesClass:
    description: >-
      Related resources, such as publications, code repositories, or other datasets that are related to the dataset described in this datacard.
      This helps users find additional information and resources related to the dataset, which can enhance their understanding and ability to use the dataset effectively.
    slots:
      - datasets
      - publications
      - software
      - ai_models

  ComplianceClass:
    description: >-
      Populate when release_status = Under_Review | Approved | Published.
      Fields/slots marked [sensitive] are additionally required for the sensitive profile.
      Leave blank or omit for draft and in-workflow datasets.
    slots:
      - doe_data_management_plan
      - osti_elink2_metadata_compliant
      - irb_approved
  
  CitationClass:
    description: >-
      Strongly recommend when release_status = Approved | Published.
      Replace ALL ${...} placeholders in the BibTeX block below before publishing.
    slots:
      - report_number
      - preferred_citation

  PreferredCitationClass:
    description: >-
      The preferred citation for this dataset, including a human-readable citation string and a structured BibTeX entry that can be used for programmatic citation generation.
      This helps ensure that users can properly cite the dataset in their work, which is important for giving credit to the creators of the dataset and for enabling others to find and access the dataset based on citations in the literature.
    slots:
      - author
      - title
      - year
      - publisher
      - howpublished
      - doi
      - url
      - eprinttype
      - eprint
      - note
    slot_usage:
      url:
        required: false
        description: >-
          A url that resolves to the dataset landing page or other primary reference for the dataset, which can be used in citations and for users to access the dataset.
          url: is intended to correspond to the bibtex url field, and should be populated with the same value.

  AIUsageClass:
    description: >-
      AI / ML Usage:
      Describes whether and how this dataset may be used in AI/ML workflows. 
      Be explicit — these fields are read by automated pipeline tooling and AI agents.
      Conditions are required if the corresponding status for training use, inference use, or evaluation use is "Conditional".
    slots:
      - training_use_status
      - training_use_conditions
      - inference_use_status
      - inference_use_conditions
      - evaluation_use_status
      - evaluation_use_conditions
      - restrictions
      - bias_risks
      - safety_considerations
      - human_review_required
    slot_usage:
      training_use_status:
        required: true
        description: >-
          The status of whether this dataset can be used for training in AI/ML workflows.
      inference_use_status:
        description: >-
          The status of whether this dataset can be used for inference in AI/ML workflows.
        required: true
      evaluation_use_status:
        description: >-
          The status of whether this dataset can be used for evaluation in AI/ML workflows.
        required: true
    rules:
      - description: >-
          If training_use_status = "Conditional", then training_use_conditions must be present.
        preconditions:
          slot_conditions:
            training_use_status:
              equals_string: "Conditional"
        postconditions:
          slot_conditions:
            training_use_conditions:
              value_presence: PRESENT
      - description: >-
          If inference_use_status = "Conditional", then inference_use_conditions must be present.
        preconditions:
          slot_conditions:
            inference_use_status:
              equals_string: "Conditional"
        postconditions:
          slot_conditions:
            inference_use_conditions:
              value_presence: PRESENT
      - description: >-
          If evaluation_use_status = "Conditional", then evaluation_use_conditions must be present.
        preconditions:
          slot_conditions:
            evaluation_use_status:
              equals_string: "Conditional"
        postconditions:
          slot_conditions:
            evaluation_use_conditions:
              value_presence: PRESENT

  DataQualityClass:
    description: >-
      Data Quality & Limitations:
      Be specific — vague entries reduce trust and reuse.
      Describes the quality of the dataset and any known limitations, which is important for users to understand the reliability and suitability of the 
      dataset for their needs.
    slots:
      - completeness
      - known_issues
      - validation_methods
      - noise_characteristics
      - uncertainty_notes
      - missing_data_codes

  MissingDataCodesClass:
    description: >-
      A collection of codes used in the dataset to indicate missing or null values, along with their meanings.
      This helps users understand how missing data is represented in the dataset, which is important for data analysis and preprocessing.
    slots:
      - code
      - description
    slot_usage:
      code:
        required: true
        description: "The code used in the dataset to indicate a missing or null value."
        in_subset:
          - situational_required
      description:
        required: true
        in_subset:
          - situational_required
        description: "A description of what the missing data code represents."

  IntegrityClass:
    description: >-
      Data Integrity & Validation:
      Checksums enable automated validation of data integrity after transfer or storage.
      Describes the integrity of the dataset and any validation methods used to ensure its quality, 
      which is important for users to assess the reliability of the dataset and understand how it was validated.
    slots:
      - checksum_available
      - checksum_type
      - checksum_value
      - fixity_policy
    rules:
      - description: >-
          If checksum_available is "Yes", then checksum_type and checksum_value must be present.
        preconditions:
          slot_conditions:
            checksum_available:
                equals_string: "Yes"
        postconditions:
          slot_conditions:
            checksum_type:
              value_presence: PRESENT
            checksum_value:
              value_presence: PRESENT
  
  SemanticLayerClass:
    description: >-
      Semantic Layer for AI Agents
      This block provides a structured semantic layer that can be used by AI agents to understand and reason about the dataset and its metadata. 
      It includes key-value pairs that capture important information about the dataset in a format that is easily interpretable by AI systems.
    slots:
      - schema_url
      - semantic_context

  AnyValue:
    description: >-
      A slot that can take any value, used for fields where a controlled vocabulary is not necessary or not yet established.
      Use when the field can contain a wide range of values that do not fit into a predefined set, or when flexibility is needed for future expansion.
    slots:
      - value

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------
enums:  
  IdentifierTypeEnum:
    description: "The type of identifier, following a controlled vocabulary (e.g., DOI, UUID, ARK)."
    permissible_values:
      - ark
      - doi
      - handle
      - local
      - purl
      - url
      - urn
      - uuid
      - other
      - unregistered

  OverallSensitivityEnum:
    description: >-
      Controlled vocabulary for the human-readable top-level sensitivity posture of the asset.
      This field is intended to provide a high-level summary of the overall sensitivity posture of the asset.
    permissible_values:
      Public:
        description: "No sensitivity; publicly shareable."
      Unclassified_Uncontrolled:
        description: >-
          Unclassified but uncontrolled; may have minimal sensitivity; 
          generally shareable with minimal controls.
      CUI:
        description: >-
          CUI (Controlled Unclassified Information); 
          requires handling per CUI guidelines; access controls required.
      UCNI:
        description: >-
          UCNI (Unclassified Controlled Nuclear Information); 
          requires handling per UCNI guidelines; strict access controls required.
      Classified:
        description: >-
          Classified information; requires handling per classification level and guide; 
          strict access controls required.
      Legacy_Controlled:
        description: >-
          Legacy controlled information; may have specific handling requirements based on legacy controls; 
          access controls required.
      Mixed:
        description: >-
          Mixed sensitivity; contains a combination of sensitive and non-sensitive information; 
          handling requirements depend on the specific content; access controls required.
      Other_Controlled:
        description: >-
          Other controlled information; may have specific handling requirements based on other controls; 
          access controls required.

  SourceMarkingSchemeEnum:
    description: >-
      Controlled vocabulary that identifies the authoritative source marking regime for the asset.
      This describes the marking scheme used to identify sensitive information in the dataset, 
      which is important for users to understand how sensitivity is indicated and what markings to look for when handling the dataset.
    permissible_values:
      - DOE_CUI
      - DOE_UCNI
      - EO13526_Classified
      - AEA_RD_FRD_TFNI
      - DOD_CUI
      - DHS_CUI
      - Legacy_OUO
      - Legacy_Site_Specific
      - Other_Agency
      - None
      
  AccessLevelEnum:
    description: "The access level of the document being described."
    permissible_values:
      Open:
        description: "Anyone can discover and access without special permissions."
      Restricted:
        description: "Data may be discoverable, but users must satisfy basic access requirements (authentication, affiliation, registration, agreement to terms, etc.)."
      Controlled:
        description: "Access is granted only after review and explicit authorization based on the requester, intended use, legal requirements, or security considerations."
  
  DatacardCreationMethodEnum:
    description: "How this datacard was created or most recently updated."
    permissible_values:
      Manual:
        description: "Created entirely manually by a human author."
      Automated:
        description: "Generated entirely by a pipeline, AI model, or other automated process."
      Hybrid:
        description: >-
          Created using a combination of manual and automated methods.

  RoleEnum:
    description: >-
      The role of a type (person, organization, AI model, or software tool) in relation to the datacard or dataset.
      This describes the role of an agent (which could be a person, organization, AI model, or software tool) in relation to an activity or asset.
      The following vocabularies apply to the RoleEnum:
      * CRediT taxonomy (https://zenodo.org/records/18421449) where applicable, 
      but is extended to cover additional roles relevant to datasets and datacards, such as data collection, curation, sponsorship, and access provision.
      DataCite contributorType (https://datacite-metadata-schema.readthedocs.io/en/latest/appendices/appendix-1/contributorType/#) where applicable;
      CRediT (https://casrai.org/credit/roles/) where applicable;
      Dublin Core (https://www.dublincore.org/specifications/dublin-core/dcmi-terms/#) where applicable;
      and PROV roles where applicable.
    permissible_values:
      Conceptualization:
        description: >-
          Ideas; formulation or evolution of overarching research goals and aims.
        exact_mappings: 
          - credit:conceptualization
      Contact_Person:
        description: >-
          Person with knowledge of how to access, troubleshoot, or otherwise field issues related to the resource.
        exact_mappings: 
          - datacite_contributor:ContactPerson
      Contributor:
        description: >-
          A contributor is associated with either the creation activity or the updating of the resource. 
          Therefore, he/she has attribution over the outcome of those activities.
        close_mappings: 
          - dcterms:contributor
      Creator:
        description: >-
          An entity responsible for making the resource.
        close_mappings: 
          - dcterms:creator
      Data_Curator:
        description: >-
          Person/agent/software tasked with reviewing, enhancing, cleaning, or standardizing metadata and the associated data submitted for storage, use, and maintenance within a data centre or repository.
        exact_mappings: 
          - datacite_contributor:DataCurator
          - credit:data-curation
      Data_Manager:
        description: >-
          Person (or organisation with a staff of data managers, such as a data centre) responsible for maintaining the finished resource.
        exact_mappings: 
          - datacite_contributor:DataManager
      Distributor:
        description: >-
          Institution tasked with responsibility to generate/disseminate copies of the resource in either electronic or print form.
        exact_mappings: 
          - datacite_contributor:Distributor
      Editor:
        description: >-
          A person who oversees the details related to the publication format of the resource.
        exact_mappings: 
          - datacite_contributor:Editor
      Formal_Analysis:
        description: >-
          Application of statistical, mathematical, computational, or other formal techniques to analyse or synthesize study data.
        exact_mappings: 
          - credit:formal-analysis
      Funding_Acquisition:
        description: >-
          Acquisition of the financial support for the project leading to this publication.
        exact_mappings: 
          - credit:funding-acquisition
      Hosting_Institution:
        description: >-
          Typically, the organisation allowing the resource to be available on the internet through the provision of its hardware/software/operating support.
        exact_mappings: 
          - datacite_contributor:HostingInstitution
      Investigation:
        description: >-
          Conducting a research and investigation process, specifically performing the experiments, 
          or data/evidence collection. Includes field work, lab work, and other research-based data collection.
        exact_mappings: 
          - credit:investigation
      Methodology:
        description: >-
          Development or design of methodology; creation of models.
        exact_mappings: 
          - credit:methodology
      Producer:
        description: >-
          Typically, a person or organisation responsible for the artistry and form of a media product.
        exact_mappings: 
          - datacite_contributor:Producer
      Project_Administration:
        description: >-
          Management and coordination responsibility for the research activity planning and execution.
        exact_mappings: 
          - credit:project-administration
      Project_Leader:
        description: >-
          Person officially designated as head of project team 
          or sub-project team instrumental in the work necessary to development of the resource.
        exact_mappings: 
          - datacite_contributor:ProjectLeader
      Project_Manager:
        description: >-
          Person officially designated as head of project team 
          or sub-project team instrumental in the work necessary to development of the resource.
        exact_mappings: 
          - datacite_contributor:ProjectManager
      Project_Member:
        description: >-
          Person on the membership list of a designated project/project team.
        exact_mappings: 
          - datacite_contributor:ProjectMember
      Publisher:
        description: >-
          A publisher has the attribution of the published resource after participating in the publishing activity that generated it.
        exact_mappings: 
          - dcterms:publisher
      Registration_Agency:
        description: >-
          Institution/organisation officially appointed by a Registration Authority to handle specific tasks within a defined area of responsibility.
        exact_mappings: 
          - datacite_contributor:RegistrationAgency
      Registration_Authority:
        description: >-
          A standards-setting body from which Registration Agencies obtain official recognition and guidance.
        exact_mappings: 
          - datacite_contributor:RegistrationAuthority
      Related_Person:
        description: >-
          A person without a specifically defined role in the development of the resource, but who is someone the author wishes to recognize.
        exact_mappings: 
          - datacite_contributor:RelatedPerson
      Researcher:
        description: >-
          A person involved in analysing data or the results of an experiment or formal study.
        exact_mappings: 
          - datacite_contributor:Researcher
      Research_Group:
        description: >-
          Typically refers to a group of individuals with a lab, department, or division that has a specifically defined focus of activity.
        exact_mappings: 
          - datacite_contributor:ResearchGroup
      Resources:
        description: >-
          Provision of study materials, reagents, materials, patients, laboratory samples,
          animals, instrumentation, computing resources, or other analysis tools.
        exact_mappings: 
          - credit:resources
      Rights_Holder:
        description: >-
          Person or institution owning or managing property rights, including intellectual property rights over the resource.
        exact_mappings: 
          - datacite_contributor:RightsHolder
      Software:
        description: >-
          Programming, software development; designing computer programs; 
          implementation of the computer code and supporting algorithms; 
          testing of existing code components.
        exact_mappings: 
          - credit:software
      Sponsor:
        description: >-
          Person or organisation that issued a contract or under 
          the auspices of which a work has been written, printed, published, developed, etc
        exact_mappings: 
          - datacite_contributor:Sponsor
      Supervision:
        description: >-
          Oversight and leadership responsibility for the research activity planning and execution, 
          including mentorship external to the core team.
        exact_mappings:
          - datacite_contributor:Supervisor
          - credit:supervision
      Translator:
        description: >-
          A person, organization, or automated system responsible for converting the 
          content of a resource from one language into another, preserving its meaning and intended message.
        exact_mappings: 
          - datacite_contributor:Translator
      Validation:
        description: >-
          Verification, whether as a part of the activity or separate, 
          of the overall replication/reproducibility of results/experiments and other research outputs.
        exact_mappings: 
          - credit:validation
      Visualization:
        description: >-
          Preparation, creation and/or presentation of the published work, specifically visualization / data presentation.
        exact_mappings: 
          - credit:visualization
      Work_Package_Leader:
        description: >-
          A Work Package is a recognized data product, not all of which is included in publication. 
          The package, instead, may include notes, discarded documents, etc. 
          The Work Package Leader is responsible for ensuring the comprehensive 
          contents, versioning, and availability of the Work Package during the development of the resource.
        exact_mappings: 
          - datacite_contributor:WorkPackageLeader
      Writing_Original_Draft:
        description: >-
          Preparation, creation and/or presentation of the published work, 
          specifically writing the initial draft (including substantive translation).
        exact_mappings: 
          - credit:writing-original-draft
      Writing_Review_Editing:
        description: >-
          Preparation, creation and/or presentation of the published work by those from the original
          research group, specifically critical review, commentary or revision - including pre- or post-publication stages.
        exact_mappings: 
          - credit:writing-review-editing
        close_mappings:
          - datacite_contributor:Editor
      Other:
        description: >-
          Any person or institution making a significant contribution to the development 
          and/or maintenance of the resource, but whose contribution is not adequately 
          described by any of the other values for contributorType.
        exact_mappings: 
          - datacite_contributor:Other

  ProductTypeEnum:
    description: >-
      The type of product described by this datacard. 
      These align with and extend the STI Product Types.
    permissible_values:
      "Accomplishment Report":
        description: "A report describing the accomplishments of a project or program."
      "Book":
        description: "A book or monograph."
      "Conference":
        description: "A conference or workshop, including its proceedings."
      "Dataset":
        description: "A dataset."
      "Factsheet":
        description: "A brief document providing key information about a topic, project, or product."
      "Journal_Article":
        description: "A journal article."
      "Miscellaneous":
        description: "Any other type of product not covered by the above categories."
      "Other":
        description: "Any other type of product not covered by the above categories."
      "Patent":
        description: "A patent or patent application."
      "Program_Document":
        description: "A program, project, or initiative document."
      "Software_Manual":
        description: "A software manual or user guide."
      "Thesis/Dissertation":
        description: "A thesis or dissertation."
      "Technical_Report":
        description: "A technical report or white paper."
      "Patent_Application":
        description: "A patent application."
      "Collection":
        description: "A collection of scientific and technical information (STI) products, such as a special issue of a journal, a conference proceedings, or a project data repository (extends OSTI Product Type)."
      "Computer_Related":
        description: "Computer-related products, such as software packages, pipelines, or automated processes (extends OSTI Product Type)."
      "Model":
        description: "A computational model, simulation, or trained machine learning model (extends OSTI Product Type)."
      "Agent":
        description: "An AI agent or automated system (extends OSTI Product Type)."

  ObjectTypeEnum:
    description: >-
      Primary type of digital object described by this card.
      Used for alignment to other card types.
      Examples:
      a datacard describing a dataset would use Dataset; 
      a datacard describing a software tool would use Software; 
      a datacard describing an AI agent would use AI_Agent; 
      a datacard describing an infrastructure would use Infrastructure; 
      a datacard describing a resource would use Resource; 
      a datacard describing any other type of object would use Other.
      This is a high-level categorization to facilitate filtering and discovery, and alignment to other card types (e.g., software cards, model cards, agent cards).
      It is not intended to capture detailed scientific domain categories 
      (e.g., physics, chemistry, earth science) or data type categories (e.g., image, text, tabular).
    permissible_values:
      Dataset:
        description: "A dataset, which may be described by a datacard."
      Model:
        description: "A model, which may be described by a datacard."
      Software:
        description: "A software tool, pipeline, or automated process."
      AI_Agent:
        description: "An AI agent, which may be described by a datacard."
      Infrastructure:
        description: "An infrastructure, which may be described by a datacard."
      Resource:
        description: "A resource, which may be described by a datacard."
      Other:
        description: "Any other type of object not covered by the above categories."

  DatasetTypeEnum:
    description: "OSTI DOE Dataset Type code."
    permissible_values:
      Instrument:
        description: "Submitted dataset is Instrument-based data."
      
  ReleaseStatusEnum:
    description: "Current publication and governance state of this dataset."
    permissible_values:
      Draft:
        description: "The dataset is a work in progress. It is in draft form and not yet ready for sharing or publication."
      Under_Review:
        description: "The dataset has been submitted for review by internal or external stakeholders. It is not yet approved for sharing or publication."
      Approved:
        description: "The dataset has been reviewed and approved for sharing or publication, but has not yet been released."
      Published:
        description: >-
          The dataset has been published and is available for access and use. 
          Does not necessarily indicate that the dataset was reviewed and approved by a formal governing body.
      Deprecated:
        description: "The dataset has been superseded or retired and should not be used."

  StateEnum:
    description: "Current lifecycle position:"
    permissible_values:
      Raw:
        description: "Data as collected in its original, unprocessed form."
      Processing:
        description: "Data actively being cleaned, transformed, or reduced."
      QA:
        description: "Data undergoing quality assurance or validation."
      Analysis:
        description: "Data in active scientific analysis."
      Review:
        description: "Data under formal review (security, export, IRB, etc.)."
      Embargo:
        description: "Data under temporary restriction or embargo, withheld from release."
      Published:
        description: "Data that has been published and is available for access and use."
      Archived:
        description: "Data that is no longer actively maintained but preserved for historical record or reference."
      not_applicable:
        description: "Lifecycle state does not apply to this dataset."
  
  AuthorizationRequiredEnum:
    description: "Controlled vocabulary for whether authorization is required to access the dataset."
    permissible_values:
      Account:
        description: "Registered account is required to access the dataset."
      User_Agreement:
        description: "User agreement is required to access the dataset."
      Data_Use_Agreement:
        description: "Formal Data Use Agreement (DUA) is required to access the dataset."
      Sponsor_Approval:
        description: "Approval from the dataset sponsor is required to access the dataset."
      Export_Control_Review:
        description: "Export control review is required to access the dataset."
      IRB_Approval:
        description: "Institutional Review Board (IRB) approval is required to access the dataset."
      Other:
        description: "Other authorization requirements may apply to access the dataset: describe in access_restrictions."

  AuthenticationTypeEnum:
    description: "Controlled vocabulary for types of authentication required to access the dataset."
    permissible_values:
      "None":
        description: "No authentication is required to access the dataset."
      "API_Key":
        description: "API key is required to access the dataset."
      "OAuth2":
        description: "OAuth2 authentication is required to access the dataset."
      "SAML":
        description: "SAML authentication is required to access the dataset."
      "Certificate":
        description: "Certificate-based authentication is required to access the dataset."
      "OpenID_Connect":
        description: "OpenID Connect authentication is required to access the dataset."
      "Basic_Auth":
        description: "Basic authentication is required to access the dataset."
      "Bearer_Token":
        description: "Bearer token authentication is required to access the dataset."
      "Other":
        description: "Other types of authentication may be required to access the dataset."

  RelationshipTypeEnum:
    description: "Controlled vocabulary for the relationship between an artifact (B) and the artifact described in the xCard (A)."
    permissible_values:
      is_cited_by:
        description: "Indicates that B includes A in a citation"
        exact_mappings:
          - datacite_relations:IsCitedBy
        close_mappings:
          - dcterms:isReferencedBy
      cites:
        description: "Indicates that A includes B in a citation"
        exact_mappings:
          - datacite_relations:Cites
          - dcterms:references
        close_mappings:
          - prov:wasQuotedFrom
      in_series:
        description: "A dataset series of which the dataset is part."
        exact_mappings:
          - dcat:inSeries
        close_mappings:
          - dcterms:isPartOf
      is_supplement_to:
        description: "Indicates that A is a supplement to B."
        exact_mappings:
          - datacite_relations:IsSupplementTo
      is_supplemented_by:
        description: "Indicates that B is a supplement to A."
        exact_mappings:
          - datacite_relations:IsSupplementedBy
      is_continued_by:
        description: "Indicates A is continued by the work B"
        exact_mappings:
          - datacite_relations:IsContinuedBy
      continues:
        description: "Indicates A is a continuation of the work B"
        exact_mappings:
          - datacite_relations:Continues
      describes:
        description: "Indicates A describes B"
        exact_mappings:
          - datacite_relations:Describes
      is_described_by:
        description: "Indicates A is described by B"
        exact_mappings:
          - datacite_relations:IsDescribedBy
      has_metadata:
        description: "Indicates resource A has additional metadata B"
        exact_mappings:
          - datacite_relations:HasMetadata
      is_metadata_for:
        description: "Indicates additional metadata A for a resource B"
        exact_mappings:
          - datacite_relations:IsMetadataFor
      has_version:
        description: "Indicates A has a version B"
        exact_mappings:
          - datacite_relations:HasVersion
        close_mappings:
          - dcat:hasVersion
      is_version_of:
        description: "Indicates A is a version of B"
        exact_mappings:
          - datacite_relations:IsVersionOf
      is_previous_version_of:
        description: "Indicates A is a previous edition of B"
        exact_mappings:
          - datacite_relations:IsPreviousVersionOf
          - dcat:previousVersion
      is_part_of:
        description: "Indicates A is a portion of B; may be used for elements of a series"
        exact_mappings:
          - datacite_relations:IsPartOf
          - dcterms:isPartOf
      has_part:
        description: "Indicates A includes the part B"
        exact_mappings:
          - datacite_relations:HasPart
          - dcterms:hasPart
      is_published_in:
        description: "Indicates A is published inside B, but is independent of other things published inside of B"
        exact_mappings:
          - datacite_relations:IsPublishedIn
      is_referenced_by:
        description: "Indicates A is used as a source of information by B"
        exact_mappings:
          - datacite_relations:IsReferencedBy
          - dcterms:isReferencedBy
      references:
        description: "Indicates B is used as a source of information for A"
        exact_mappings:
          - datacite_relations:References
          - dcterms:references
      is_documented_by:
        description: "Indicates B is documentation about/explaining A"
        exact_mappings:
          - datacite_relations:IsDocumentedBy
      documents:
        description: "Indicates A is documentation about/explaining B"
        exact_mappings:
          - datacite_relations:Documents
      is_compiled_by:
        description: >-
          Indicates B is used to compile or create A.
          May be used to indicate either a traditional text compilation, or the compiler program used to generate executable software.
        exact_mappings:
          - datacite_relations:IsCompiledBy
      compiles:
        description: >-
          Indicates B is the result of a compile or creation event using A
          May be used for software and text, as a compiler can be a computer program or an agent.
        exact_mappings:
          - datacite_relations:Compiles
      is_variant_form_of:
        description: "Indicates A is a variant or different form of B"
        exact_mappings:
          - datacite_relations:IsVariantFormOf
      is_original_form_of:
        description: "Indicates A is the original form of B"
        exact_mappings:
          - datacite_relations:IsOriginalFormOf
      is_identical_to:
        description: "Indicates that A is identical to B, for use when there is a need to register two separate instances of the same resource"
        exact_mappings:
          - datacite_relations:IsIdenticalTo
      is_reviewed_by:
        description: "Indicates that A is reviewed by B"
        exact_mappings:
          - datacite_relations:IsReviewedBy
      reviews:
        description: "Indicates that A is a review of B"
        exact_mappings:
          - datacite_relations:Reviews
      is_derived_from:
        description: "Indicates B is a source upon which A is based"
        exact_mappings:
          - prov:wasDerivedFrom
          - schema:isBasedOn
          - datacite_relations:IsDerivedFrom
          - dcterms:source
      is_source_of:
        description: "Indicates A is a source upon which B is based"
        exact_mappings:
          - datacite_relations:IsSourceOf
      is_required_by:
        description: "Indicates A is required by B"
        exact_mappings:
          - datacite_relations:IsRequiredBy
      requires:
        description: "Indicates A requires B"
        exact_mappings:
          - datacite_relations:Requires
      obsoletes:
        description: "Indicates A replaces B"
        exact_mappings:
          - datacite_relations:Obsoletes
          - dcat:replaces
      is_obsoleted_by:
        description: "Indicates A is replaced by B"
        exact_mappings:
          - datacite_relations:IsObsoletedBy
      is_collected_by:
        description: "Indicates A is collected by B"
        exact_mappings:
          - datacite_relations:IsCollectedBy
      collects:
        description: >-
          Indicates A collects B
          May be used to indicate the relationship between an instrument and where it has been used 
          to collect, measure, obtain, or observe data (as in, instrument A collects dataset B).
        exact_mappings:
          - datacite_relations:Collects
      is_translation_of:
        description: "Indicates A is a translation of B"
        exact_mappings:
          - datacite_relations:IsTranslationOf
      has_translation:
        description: "Indicates A has a translation B"
        exact_mappings:
          - datacite_relations:HasTranslation
      other:
        description: "Indicates that A is related to B and the relationship does not fit into an existing category."
        exact_mappings:
          - datacite_relations:Other
        close_mappings:
          - dcterms:relation
      generates:
        description: >-
          Indicates A (a tool, software, model, or agent) generates B.
          Use for generated outputs such as synthetic datasets or model outputs.
        related_mappings:
          - datacite_relations:Compiles
          - prov:generated
        annotations:
          inverse: is_generated_by
      is_generated_by:
        description: >-
          Indicates A is generated by B (a tool, software, model, or agent).          
        related_mappings:
          - prov:wasGeneratedBy
          - datacite_relations:IsCompiledBy
        annotations:
          inverse: generates
      processes:
        description: >-
          Indicates A (a tool, software, model, or agent) processes B.
          To link a processed output back to its input, use is_derived_from.
        related_mappings:
          - prov:used
        annotations:
          inverse: is_processed_by
      is_processed_by:
        description: "Indicates A is processed by B (a tool, software, model, or agent)."
        annotations:
          inverse: processes
        related_mappings:
          - prov:used
      analyzes:
        description: "Indicates A (a tool, software, model, or agent) analyzes B."
        related_mappings:
          - prov:used
        annotations:
          inverse: is_analyzed_by
      is_analyzed_by:
        description: "Indicates A is analyzed by B (a tool, software, model, or agent)."
        related_mappings:
          - prov:used
        annotations:
          inverse: analyzes
      is_trained_on:
        description: "Indicates A (a model) is trained on B."
        exact_mappings: 
          - fair4ml:trainedOn
        annotations:
          inverse: is_used_for_training
      is_used_for_training:
        description: "Indicates A is used to train B (a model)."
        annotations:
          inverse: is_trained_on
      is_evaluated_on:
        description: "Indicates A (a model) is evaluated on B."
        exact_mappings: 
          - fair4ml:evaluatedOn
        annotations:
          inverse: is_used_for_evaluation
      is_used_for_evaluation:
        description: "Indicates A is used to evaluate B (a model)."
        annotations:
          inverse: is_evaluated_on
      tested_on:
        description: >-
          Link from a model/software/agent (A) to the dataset (B) used to test the model (following train/test/validation splits).
        exact_mappings: 
          - fair4ml:testedOn
      validated_on:
        description: >-
          Link from a model/software/agent (A) to the dataset (B) used to validate the model. 
          Typically the training dataset is a separated set from the train/testing set.
        exact_mappings: 
          - fair4ml:validatedOn
      fine_tuned_from:
        description: >-
          Relationship to point to the source model (A) used for fine tuning (if this model was fine-tuned from another one, B).
        exact_mappings: 
          - fair4ml:fineTunedFrom
      has_evaluation:
        description: >-
          Points from a model/software/agent (A) to an evaluation for the model/software/agent (B). 
          It may be an evaluation coming from the training process or with a totally unseen dataset used only for evaluation purposes 
          (e.g., a benchmark, extrinsic validation).
        close_mappings:
          fair4ml:hasEvaluation

  StewardshipLevelEnum:
    description: "Controlled vocabulary for the stewardship level/management of the dataset."
    permissible_values:
      Project_Managed:
        description: >-
          Project level stewardship; dataset is maintained by the project or research team that created it, 
          with maintenance and updates occurring based on project resources and priorities.
      Repository_Managed:
        description: >-
          Repository level stewardship; dataset is maintained by the repository or catalog system where it is hosted, 
          with ongoing maintenance, updates, and curation to ensure long-term accessibility and usability.
      Externally_Managed:
        description: >-
          Externally managed stewardship; dataset is maintained by an external organization or entity, 
          such as a government agency, research institution, or commercial provider.
      not_applicable:
        description: "Stewardship level is not applicable or not known for this dataset."
  
  ScienceDomainEnum:
    description: "Controlled vocabulary for the scientific domain or discipline of the dataset. Extends OSTI's identified Subject Areas.'"
