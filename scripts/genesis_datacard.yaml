      "Chemistry":
        description: "The field of chemistry, including subfields such as organic chemistry, inorganic chemistry, and physical chemistry."
      "Energy Storage, Conversion, and Utilization":
        description: "The field of energy storage, conversion, and utilization, including subfields such as battery technology, fuel cells, and renewable energy systems."
      "Engineering":
        description: "The field of engineering, including subfields such as mechanical engineering, electrical engineering, and civil engineering."
      "Environmental Sciences":
        description: "The field of environmental sciences, including subfields such as ecology, climate science, and environmental chemistry."
      "Fission and Nuclear Technologies":
        description: "The field of fission and nuclear technologies, including subfields such as nuclear reactor physics, nuclear fuel cycle, and nuclear materials."
      "Fossil Fuels":
        description: "The field of fossil fuels, including subfields such as petroleum engineering, coal science, and natural gas technology."
      "Geosciences":
        description: "The field of geosciences, including subfields such as geology, geophysics, and geochemistry."
      "Materials":
        description: "The field of materials science, including subfields such as materials characterization, materials synthesis, and materials modeling."
      "Mathematics and Computing":
        description: "The fields of mathematics and computing, including subfields such as algebra, calculus, artificial intelligence, machine learning, and data science."
      "National Defense":
        description: "The field of national defense, including subfields such as military technology, defense systems, and security studies."
      "Physics":
        description: "The field of physics, including subfields such as particle physics, condensed matter physics, and astrophysics."
      "Power Generation and Distribution":
        description: "The field of power generation and distribution, including subfields such as electrical power systems, renewable energy integration, and smart grid technologies."
      "Renewable Energy":
        description: "The field of renewable energy, including subfields such as solar energy, wind energy, and bioenergy."
      "Other":
        description: "Extends the OSTI Subject Areas; the field is related to a scientific domain not covered by the above categories."
  
  UpdateFrequencyEnum:
    description: "Controlled vocabulary for how frequently the dataset is updated."
    permissible_values:
