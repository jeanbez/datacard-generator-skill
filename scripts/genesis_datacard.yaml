      - "No"
  
  YesNoConditionalEnum:
    description: >-
      Controlled vocabulary for fields with "Yes", "No", or "Conditional" values. Use quotes to ensure these are treated as strings, not booleans.
    permissible_values:
      - "Yes"
      - "No"
      - "Conditional"

  YesNoUnknownEnum:
    description: >-
      Controlled vocabulary for fields with "Yes", "No", or "Unknown" values. Use quotes to ensure these are treated as strings, not booleans.
    permissible_values:
      - "Yes"
      - "No"
      - "Unknown"

  YesNoUnknownNotApplicableEnum:
    description: >-
      Controlled vocabulary for fields with "Yes", "No", "Unknown", or "not_applicable" values. Use quotes to ensure these are treated as strings, not booleans.
    permissible_values:
      - "Yes"
      - "No"
      - "Unknown"
      - "not_applicable"

  YesNoPendingUnknownEnum:
    description: >-
      Controlled vocabulary for fields with "Yes", "No", "Pending_Review", or "Unknown" values. Use quotes to ensure these are treated as strings, not booleans.
    permissible_values:
      - "Yes"
      - "No"
      - "Pending_Review"
      - "Unknown"

  ExportControlBasisEnum:
    description: >-
      Controlled vocabulary for the basis of the export control classification of the dataset.
    permissible_values:
      - ITAR
      - EAR
      - DOE_Nuclear_Export_Control
      - Other
      - not_applicable
  
  ForeignNationalAccessStatusEnum:
    description: >-
      Controlled vocabulary for Governance-facing outcome field indicating whether foreign national access
      is allowed, restricted, prohibited, or conditional, based on the combined
      effect of applicable export, classification, dissemination, agreement,
      or other source-authoritative constraints.
    permissible_values:
      - Allowed
      - Restricted
      - Prohibited
      - Conditional
      - Unknown
  
  PrivacyControlBasisEnum:
    description: >-
      Controlled vocabulary for the basis of the privacy control classification of the dataset, based on applicable regulations, policies, or standards.
    permissible_values:
      - HIPAA
      - Privacy_Act
      - Human_Subjects
      - Other_Regulated_Privacy
      - Site_Specific
      - not_applicable

  IPRestrictionTypeEnum:
    description: >-
      Controlled vocabulary for the type of IP-based access restriction applied to the dataset.
    permissible_values:
      - Proprietary
      - Limited_Rights
      - Restricted_Rights
      - Government_Purpose_Rights
      - Unlimited_Rights
      - Third_Party_Licensed
      - None

  AgreementTypeEnum:
    description: >-
      Controlled vocabulary for the type of agreement required for access to the dataset.
    permissible_values:
      - DUA
      - CRADA
      - MOU
      - NDA
      - LICENSE
      - WFO
      - OTHER

  PublicReleaseStatusEnum:
    description: >-
      Controlled vocabulary for the public release status of the dataset, 
      indicating whether it has been approved for public release and sharing.
    permissible_values:
      - "Approved"
      - "Pending"
      - "Not_Approved"
      - "Requires_STI_Review"

  RecordStatusEnum:
    description: >-
      Controlled vocabulary for the records status of the dataset, 
      indicating whether it is considered a record that must be retained according to applicable records management policies and regulations.
    permissible_values:
      - "Federal_Record"
      - "Contractor_Record"
      - "Non_Record"
      - "Mixed"
      - "Unknown"

  ApprovedEnvironmentEnum:
    description: >-
      Controlled vocabulary for the approved environment of the dataset, 
      indicating whether it is approved for use in specific environments or systems.
    permissible_values:
      - "JUCE"
      - "Classified Enclave"
      - "CUI Approved Enclave"
      - "Cloud Enclave (Authorized)"

# ---------------------------------------------------------------------------
# Subsets
# ---------------------------------------------------------------------------
subsets:
  # Subset of DataCard metadata elements
  # Corresponds to annotations in the datacard template and guidance to indicate which fields are required for different intended uses.
  required:
    description: >-
      Required for all datacards, regardless of intended use or sharing level and use.
  situational_required:
    description: >-
      Required if the parent field is present, but may not be applicable to all datasets.
  if_applicable:
    description: >-
      Optional, but recommended.
      These fields may not be applicable to all datasets, 
      but should be included when relevant and available to provide important context for users, both humans and machines.
  discoverability_required:
    description: >-
      These essential fields are designed to facilitate discovery using the datacard metadata.
      These encompass the minimum set of metadata fields that should be included in all datacards for datasets
      in catalogs and repositories, to support basic findability.
  discoverability_if_applicable:
    description: >-
      Optional, but recommended, for datacards of datasets that are intended to be discoverable 
      in catalogs and repositories, to support basic findability.
      These fields may not be applicable to all datasets, 
      but should be included when relevant and available to enhance discoverability and provide important context 
      for users, both humans and machines.
  accessibility_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be shared or accessed by others, 
      whether internally within a project or organization, with external collaborators, or publicly.
      These fields provide critical information about how the dataset can be accessed, requested, retrieved, cited, and reused by others, 
      in addition to information on how to contact the point of contact(s) for access requests, and any restrictions or requirements for access, 
      which is essential for enabling accessibility and reuse of the dataset by others.
  accessibility_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be shared or accessed by others, 
      whether internally within a project or organization, with external collaborators, or publicly.
      They provide additional information about how to access the dataset, 
      including any restrictions or requirements for access, which can enhance accessibility and support reuse of the dataset by others.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, both humans and machines, about how to access the dataset.
  interoperability_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be interoperable, 
      meaning they are intended to be integrated with other datasets or systems, or used in combination with other datasets.
      These fields provide critical information about the meaning, data representation and structure, provenance, 
      related resources and integrity of the dataset.
  interoperability_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be interoperable.
      They provide additional information about the meaning, data representation and structure, provenance, 
      related resources and integrity of the dataset that can enhance interoperability and support integration with other datasets or systems.
      They may not be applicable to all datasets, but should be included when relevant and available.
  reusability_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be reusable, 
      meaning they are intended to be reused by others for the same or different purposes.
      These fields provide critical information about the the authorship, license, stewardship, and data_quality.
      This information is essential for enabling reuse of the dataset by others, 
      as it informs users about the permissions, responsibilities, and quality of the dataset, 
      which are key factors in determining whether and how a dataset can be reused for a particular purpose.
  reusability_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be reusable.
      They provide additional information about the license, stewardship, 
      and data quality of the dataset that can enhance reuse and support informed decision-making by users about 
      whether and how to reuse the dataset for a particular purpose.
      These include optional domain-specific metadata fields that can provide important context about the dataset for users in specific scientific domains, 
      such as scientific domain, data type, and experimental method, which can be critical for determining the relevance and 
      suitability of the dataset for specific research questions or analyses.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, 
      both humans and machines, about the reuse potential of the dataset.
  governed_use_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be shared or accessed under specific governance or oversight, 
      such as datasets that are subject to security controls, export control, IRB oversight, or other types of formal review and approval processes.
      These fields provide critical information about the governance and oversight for the dataset, 
      which is essential for ensuring that the dataset is shared and accessed in compliance with applicable regulations,
      policies, and ethical considerations, and for enabling responsible use of the dataset by others.
  governed_use_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be shared or accessed under specific governance or oversight.
      They provide additional information about the governance and oversight for the dataset that can enhance responsible sharing and use of the dataset by others.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, both humans and machines, about the governance and oversight for the dataset.
  ai_usability_required:
    description: >-
      These fields are required for datacards of datasets that are intended to be used for AI training, evaluation, or other AI-related purposes.
      These fields provide critical information about the allowed ai use for AI purposes.
      This information is essential for enabling responsible use of the dataset for AI purposes by others, 
      as it informs users about the permissions, restrictions, and requirements for using the dataset for AI purposes, 
      which are key factors in determining whether and how a dataset can be used by AI.
  ai_usability_if_applicable:
    description: >-
      These fields are optional, but recommended, for datacards of datasets that are intended to be used for AI training, evaluation, or other AI-related purposes.
      They provide additional information about the restrictions, biases, risks, safety considerations, and other factors related to using the dataset for AI purposes 
      that can enhance responsible use of the dataset for AI purposes by others.
      They may not be applicable to all datasets, but should be included when relevant and available to provide important context for users, 
      both humans and machines, about the usability of the dataset for AI purposes.
  reference_only_do_not_include:
    description: >-
      These fields are provided for reference only and should not be included in a final, completed datacard.

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:
  supports_discoverability:
    range: YesNoEnum
    pattern: "Yes"
    required: true
    in_subset:
      - required
    description: >-
      "Yes" is required for all datacards to indicate whether the dataset 
      described in the datacard is intended to be discoverable in catalogs and repositories.
      Does not necessarily indicate that the dataset is currently discoverable or that it
      meets all criteria for discoverability.

  supports_accessibility:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be shared or accessed by others, 
      whether internally within a project or organization, with external collaborators, or publicly.
      Does not necessarily indicate that the dataset is currently accessible or that it meets all criteria for accessibility.

  supports_interoperability:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be interoperable, 
      meaning it is intended to be integrated with other datasets or systems, or used in combination with other datasets.
      Does not necessarily indicate that the dataset is currently interoperable or that it meets all criteria for interoperability.

  supports_reusability:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be reusable, 
      meaning it is intended to be reused by others for the same or different purposes.
      Does not necessarily indicate that the dataset is currently reusable or that it meets all criteria for reusability.
  
  supports_governed_use:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be shared or accessed 
      under specific governance or oversight, such as datasets that are subject to security controls, export control, IRB oversight, or other types of formal review and approval processes.
      Does not necessarily indicate that the dataset is currently shared or accessed under specific governance or oversight, or that it meets all criteria for governed use.
    
  supports_ai_usability:
    range: YesNoEnum
    required: true
    in_subset:
      - required
    description: >-
      "Yes" | "No" - Indicates whether the dataset described in the datacard is intended to be used for AI training, evaluation, or other AI-related purposes.
      Does not necessarily indicate that the dataset is currently used for AI purposes or that it meets all criteria for AI usability.

  discoverability:
    range: DiscoverabilityClass
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      ###---Discoverability---###
      Metadata fields that support the discoverability of the dataset,
      a key aspect of the FAIR principles and essential for enabling users to find the dataset in catalogs and repositories.
      These fields provide critical information that can enhance the data's discoverability and help users understand its relevance and suitability for their needs.
      The discoverability capability is required for all datacards to support basic findability in catalogs and repositories.

  accessibility:
    range: AccessibilityClass
    inlined: true
    in_subset:
      - accessibility_required
    description: >-
      ###---Accessibility---###
      Metadata fields that support the accessibility of the dataset.
      These fields provide critical information about how to access the dataset, 
      including any restrictions or requirements for access.
      The accessibility capability is required for datacards of datasets that are intended to be shared or accessed by others, 
      whether internally within a project or organization, with external collaborators, or publicly.

  interoperability:
    range: InteroperabilityClass
    inlined: true
    in_subset:
      - interoperability_required
    description: >-
      ###---Interoperability---###
      These fields are intended to enable users to integrate the dataset with other datasets or systems, 
      or use it in combination with other datasets.
      These fields provide critical information about the meaning, data representation and structure, provenance, related resources and integrity of the dataset.

  reusability:
    range: ReusabilityClass
    inlined: true
    in_subset:
      - reusability_required
    description: >-
      ###---Reusability---###
      Metadata fields that support the reusability of the dataset,
      and enables users to reuse the dataset for the same or different purposes.
      These fields provide critical information about the authorship, license, stewardship, and data quality of the dataset.
      The reusability capability is required for datacards of datasets that are intended to be reusable.

  governed_use:
    range: GovernedUseClass
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      ###---Governed Use---###
      Metadata fields that support the governed use of the dataset,
      which is essential for ensuring that the dataset is shared and accessed in compliance with applicable regulations,
      policies, and ethical considerations, and for enabling responsible use of the dataset by others.
      The governed_use capability is required for datacards of datasets that are intended to be shared or accessed 
      under specific governance or oversight, such as datasets that are subject to security controls, 
      export control, or other types of formal review and approval processes.

  ai_usability:
    range: AIUsabilityClass
    inlined: true
    in_subset:
      - ai_usability_required
    description: >-
      ###---AI Usability---###
      Metadata fields that support the AI usability of the dataset,
      These fields provide critical information about the allowed ai use for AI purposes, as well as 
      any restrictions, biases, risks, safety considerations, and other factors related to using the dataset 
      for AI purposes.
      The ai_usability capability is required for datacards of datasets 
      that are intended to be used for AI training, evaluation, or other AI-related purposes.
  name:
    identifier: true
    required: true
    range: string
    description: "Human-readable name or local string key for the entity."

  description:
    range: string
    description: "Detailed description of the entity."
    exact_mappings:
      - schema:description
      - dcterms:description
    in_subset:
      - if_applicable
    
  
  datacard:
    range: DataCardClass
    inlined: true
    description: >-
      Metadata about the datacard itself (not the dataset), 
      including its sensitivity, creation method, and change log.
    required: true
    exact_mappings:
      - prov:Entity
    in_subset:
      - discoverability_required
  
  version:
    range: string
    description: "Version of software, tool, or library."
    pattern: '^\d+\.\d+(\.\d+)?$'
    exact_mappings:
      - dcat:version
  
  template_version:
    range: string
    pattern: '^\d+\.\d+(\.\d+)?$'
    in_subset:
      - discoverability_required
    description: >-
      Current version is 2.0.0; the version of the datacard template used to create this datacard.
    required: true
    ifabsent: string(2.0.0)
  
  datacard_version:
    range: string
    ifabsent: string(1.0.0)
    pattern: '^\d+\.\d+(\.\d+)?$'
    in_subset:
      - discoverability_required
    description: >-
      Replace default value with the version of the datacard itself, 
      which should be incremented when the datacard is meaningfully updated.
      Use semantic versioning: MAJOR.MINOR.PATCH
      e.g., 1.0 → 1.1 for content updates; 1.x -> 2.0 for structural changes
    required: true
  
  filename:
    range: string
    pattern: '^genesis_datacard_[a-z0-9]+(?:_[a-z0-9]+)*\.(md|ya?ml)$'
    in_subset:
      - discoverability_required
    aliases:
      - file_name
      - datacard_filename
      - datacard_file_name
    description: >-
      The filename of the data card document, follow naming convention: "genesis_datacard_${SNAKE_CASE_DATASET_NAME}$.md"
      where ${SNAKE_CASE_DATASET_NAME} is the dataset name in snake_case format.
      Use "genesis_datacard_other_${SNAKE_CASE_DATASET_NAME}$.md" for datasets that are not part of a Genesis project or sub-project.
    required: true
    ifabsent: "genesis_datacard_${SNAKE_CASE_DATASET_NAME}.md" 
  
  language:
    range: string
    pattern: '^[a-z]{2}$|^not_applicable$'
    ifabsent: string(en)
    in_subset:
      - discoverability_required
    description: >-
      Replace default value, 'en', with the language of the datacard content, 
      following ISO 639-1 codes.
    required: true
    exact_mappings:
      - schema:inLanguage
      - dcterms:language
    examples:
      - value: "en"
      - value: "es"
      - value: "fr"
      - value: "de"
      - value: "zh"
      - value: "ru"
      - value: "ar"
      - value: "pt"
      - value: "ja"
      - value: "ko"
  
  id:
    range: IdentifierClass
    in_subset:
      - discoverability_if_applicable
    aliases:
      - identifier
      - datacard_id
      - datacard_identifier
      - PID
      - datacard_pid
    description: >-
      A unique identifier for the datacard document itself, distinct from the dataset identifier.
      Assign if the datacard is registered in a catalog or repository independently of the dataset.
      If one of type or value is provided, the other must also be provided.
    broad_mappings:
      - schema:identifier
      - dcterms:identifier
  
  identifier:
    range: IdentifierClass
    in_subset:
      - interoperability_if_applicable
    aliases:
      - id
    description: >-
      Unique identifier for an external resource, such as a DOI, ARK, or other identifier.
      If one of `type` or `value` is provided, the other must also be provided.
    required: true
    broad_mappings:
      - schema:identifier
      - dcterms:identifier

  type:
    range: IdentifierTypeEnum
    in_subset:
      - interoperability_if_applicable
    recommended: true
    description: >-
      The type of the Identifier.
    exact_mappings:
      - spar_datacite:IdentifierScheme
  
  value:
    range: string
    required: false
    recommended: true
    pattern: '^.*$'
    description: >-
      The value of the identifier, following the format specified by the 'type' field.
    exact_mappings:
      - schema:identifier
      - dcterms:identifier

  sensitivity:
    range: SensitivityClass
    inlined: true
    in_subset:
      - discoverability_required
    aliases:
      - datacard_sensitivity
      - "Genesis Sensitivity"
  
  overall_sensitivity:
    range: OverallSensitivityEnum
    required: true
    in_subset:
      - discoverability_required
    aliases:
      - sensitivity
      - overall_sensitivity_level
    description: >-
      Human-readable top-level sensitivity posture of the data card (for `discoverability.datacard.sensitivity`),
      or the dataset (for `discoverability.sensitivity`) - do not automatically set the overall sensitivity of the 
      data card and dataset sensitivity to the same value, as they may differ.
      The field value is based on the authoritative source markings and metadata fields.
      This is a summary field only and does not replace the authoritative
      fields such as the classification_status, classification_level, export_control_basis, or privacy_control_basis fields.
      Authoritative source markings and metadata fields
      should be used for access control and governance decisions.
      Use "Public" for unclassified, non-sensitive assets that can be shared publicly.

  source_marking_string:
    range: string
    required: true
    multivalued: false
    in_subset:
      - discoverability_required
    aliases:
      - marking
      - official_marking
      - source_marking
      - source_markings
      - marking_string
      - marking_banner
      - control_text
    description: >-
      Exact marking/banner/control text as it appears on the source artifact
      or in the authoritative review/release output, if applicable.
      The artifact is either the data card (for `discoverability.datacard.sensitivity`),
      or the dataset (for `discoverability.sensitivity`).
      Provides the authoritative source marking information for the asset, 
      which is critical for ensuring proper handling and access controls based on the sensitivity of the asset.
      If no source markings apply to the asset, this field should be filled with "not_applicable".
      If the asset has multiple source markings, list them separated by // with no spaces.
      This field does not replace the individual metadata fields for classification status, 
      classification level, export control basis, or privacy control basis, 
      which should still be filled out based on the authoritative source markings.
    examples:
      - value: "not_applicable"
      - value: "CUI//SP-EXPT//NOFORN"
      - value: "SECRET//RD//SIGMA 15"
      - value: "OFFICIAL USE ONLY"

  source_marking_scheme:
    range: SourceMarkingSchemeEnum
    required: true
    multivalued: false
    in_subset:
      - discoverability_required
    description: >-
      Identifies the authoritative source marking regime, for the source_marking_string field.
      Use "None" for unclassified, non-sensitive assets that can be shared publicly.
      If a Legacy_OUO is unresolved to a current standard marking, the `normalized_control_basis` 
      should be populated as "Legacy_Needs_Mapping" to indicate that the control basis is legacy 
      and needs interpretation for governance purposes.

  creation_method:
      range: DatacardCreationMethodEnum
      required: true
      in_subset:
        - discoverability_required
      description: >-
        The method by which the datacard was created, following a controlled vocabulary.
        This provides context on how the datacard was generated and can inform trust and maintenance practices.

  created_date:
      range: date
      in_subset:
        - discoverability_required
      description: >-
        The date the datacard was first created, in ISO 8601 format (YYYY-MM-DD).
        Provides temporal context for the datacard and can be used for tracking its age and relevance.
      required: true

  updated_date:
      range: date
      in_subset:
        - discoverability_if_applicable
      description: >-
        The date the datacard was last updated, in ISO 8601 format (YYYY-MM-DD).
        Date of most recent update; revise on every change to the datacard, including minor edits and version updates.
        This provides temporal context for the datacard and can be used for tracking its currency and maintenance.

  change_log:
      range: ChangeLogEntryClass
      multivalued: true
      inlined: true
      inlined_as_list: true
      in_subset:
        - discoverability_required
      description: >-
        Running history of meaningful changes to this datacard.
        Add a new entry every time the datacard is updated.
        Do not overwrite or delete prior entries.
        If there have been no changes since creation, include a single entry with the creation date and the summary 'Initial creation'.
      required: true

  change_log_entry:
      range: ChangeLogEntryClass
      in_subset:
        - discoverability_required
      description: >-
        An individual entry in the change log, documenting a specific change to the datacard.
        Each entry should include the date of the change, the datacard version after the change, 
        and a brief summary of what was changed and why.
      required: true

  change_date:
      range: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      in_subset:
        - discoverability_required
      description: >-
        The date of a specific change to the datacard, in ISO 8601 format (YYYY-MM-DD).
      required: true

  summary:
      range: string
      in_subset:
        - discoverability_required
      description: >-
        A brief description of what was changed in a specific update to the datacard and why.
        Update this text for all subsequent revisions.
        This provides context for each change and can be used for understanding the evolution of the datacard over time.
        Brief description of what changed and why.
      required: true
      examples:
        - value: "Initial creation"
        - value: "Updated license to CC-BY-4.0"
        - value: "Added checksum after file transfer to OSTI"
        - value: "Corrected collection end date"

  created_by:
      range: CreatorClass
      multivalued: true
      inlined: true
      inlined_as_list: true
      in_subset:
        - discoverability_required
      description: >-
        All individuals, organizations, AI models, or software tools
        that created or updated this datacard. 
        List in chronological order of the contribution — e.g., if an AI model generated the initial draft
        and a person then edited it, list the AI model first followed by the person.
        This provides important provenance information about the datacard and can inform trust and maintenance practices.
      required: true

  role:
      range: RoleEnum
      identifier: false
      multivalued: true
      description: >-
        The function of an entity or agent with respect to another entity or resource.
      related_mappings:
        - dcat:Role
      exact_mappings:
        - dcat:hadRole

  contribution_date:
      range: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: >-
        ISO 8601 date of an event related to the datacard or dataset.
  
  creator:
      range: AgentClass
      in_subset:
        - discoverability_required
      description: >-
        An individual, organization, AI model, or software tool that
        created the datacard or dataset in the role indicated.
        This provides important provenance information about the datacard and 
        can inform trust and maintenance practices.

  given_name:
      range: string
      description: "The given name(s) of a person."
      required: true
      in_subset:
        - situational_required

  family_name:
      range: string
      description: "The family name(s) of a person."
      required: true
      in_subset:
        - situational_required

  orcid:
      range: string
      pattern: '^https?://orcid\.org/[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}$'
      description: "The ORCID identifier for a person, in URL format."
      in_subset:
        - if_applicable
      exact_mappings:
        - dcterms:identifier
        - spar_datacite:AgentIdentifier
      examples:
        - value: "https://orcid.org/0000-0002-5755-8449"
      recommended: true

  email:
      range: string
      pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
      description: "The email address of a person."
      in_subset:
        - if_applicable

  affiliation:
      range: AffiliationClass
      inlined: true
      description: "An organization with which a person is affiliated."
      in_subset:
        - if_applicable
      recommended: true

  ror_id:
      range: string
      pattern: '^https?://ror\.org/[a-z0-9]{9}$'
      recommended: true
      description: "The ROR identifier for an organization, in URL format."
      in_subset:
        - if_applicable
      exact_mappings:
        - dcterms:identifier
        - spar_datacite:AgentIdentifier
      examples:
        - value: "https://ror.org/02vwzrd76"

  accessed_date:
      range: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: >-
        The date when an AI model or software tool was accessed for use in 
        creating or updating the datacard, in ISO 8601 format (YYYY-MM-DD).
  
  agent:
    range: AgentClass
    description: >-
      An entity that is a person, organization, AI model, or software tool that created or updated this datacard.
      This provides important provenance information about the datacard and can inform trust and maintenance practices.

  person:
    range: PersonClass
    inlined: true
    description: "A human individual."
    in_subset:
      - if_applicable
  
  organization:
      range: OrganizationClass
      inlined: true
      description: "An organization or group of individuals."
      in_subset:
        - if_applicable

  ai_model:
      range: AIModelClass
      inlined: true
      description: "An AI model."
      in_subset:
        - if_applicable

  identification:
    range: DatasetIdentificationClass
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Key metadata fields that uniquely identify this dataset.

  dataset_description:
    range: DatasetDescriptionClass
    inlined: true
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Required, essential metadata fields that provide a high-level description of the dataset, 
      including its science domain, a description, and keywords.

  project:
    range: string
    required: true
    aliases:
      - project_name
      - genesis_project
      - sub_project
    in_subset:
      - discoverability_required
    description: >-
      Replace default value if necessary with a single human-readable name from the project this dataset belongs to. 
      May be a Genesis project or sub-project, or a non-Genesis project or sub-project.
      Use the same name in the datacard filename.
    examples:
      - value: "genesis"
      - value: "genesis-fusion"
      - value: "genesis-lightsource"
      - value: "nuclear-physics"

  primary_id:
    range: IdentifierClass
    required: true
    aliases:
      - primary_identifier
      - main_id
      - main_identifier
      - dataset_id
      - dataset_identifier
      - PID
      - dataset_pid
    in_subset:
      - discoverability_required
    broad_mappings:
      - schema:identifier
      - dcterms:identifier
      - spar_datacite:Identifier
    description: >-
      Primary identifier block for this dataset.
      This is the main identifier for the dataset
      and should be globally unique and resolvable if possible.
      Strongly recommended to use a persistent identifier (PID) such as a DOI or ARK.
      If one of `type` or `value` is provided, the other must also be provided.
  
  additional_ids:
    range: IdentifierClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - discoverability_if_applicable
    broad_mappings:
      - schema:identifier
      - dcterms:identifier
      - spar_datacite:Identifier
    description: "Additional identifiers for this dataset."

  supersedes:
    range: IdentifierClass
    inlined: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Identifier of the prior version this dataset replaces.
      If one of type or value is provided, the other must also be provided.
    exact_mappings:
      - dcterms:replaces
      - datacite_relations:Obsoletes
      - dcat:replaces
  
  superseded_by:
    range: IdentifierClass
    inlined: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Identifier of the newer version that replaces this dataset.
      If one of type or value is provided, the other must also be provided.
    close_mappings:
      - dcterms:isReplacedBy
      - datacite_relations:IsObsoletedBy

  parent_collection:
    range: NamedIdentifierClass
    inlined: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Class collection or experimental campaign this
      dataset belongs to. Use when this dataset is one of many in a
      larger organized collection or ensemble.

  dataset_summary:
    range: string
    required: true
    in_subset:
      - discoverability_required
    description: >-
      A brief summary of the dataset.
      Recommend 1-3 sentences that provide a high-level overview of the dataset, its purpose, and its potential applications.
      This should be a concise overview that provides users with a quick 
      understanding of what the dataset is about and whether it may be relevant to their needs.
      Write for a broad scientific audience unfamiliar with your project.

  purpose:
    range: string
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      The purpose for which the dataset was created.
      Include the scientific question or problem it was intended to address.

  collection_methodology:
    range: string
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      How was data acquired?
    examples:
      - value: "Experimental sensors"
      - value: "Computational simulation"
      - value: "Human annotation"
      - value: "Derived from prior datasets"

  data_characteristics:
    range: string
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Describe key structural and content characteristics:
      scale, dimensionality, temporal coverage, spatial resolution.

  current_use:
    range: string
    required: true
    in_subset:
      - governed_use_required
    description: >-
     What is this dataset actively being used for right now? Distinct from intended_use.
  
  use_governance:
    range: UseGovernanceClass
    inlined: true
    required: false
    in_subset:
      - governed_use_required
    description: >-
      Information block to guide appropriate use and prevent misuse of this dataset.
  
  intended_use:
    range: string
    in_subset:
      - governed_use_if_applicable
    recommended: true
    description: >-
      Purpose and intended use stated to enable users to make a decision as to the suitability of this work 
      (e.g., lab protocol, machine learning model, software) to their experimental problem or own use case.
    exact_mappings:
      fair4ml:intendedUse
    examples:
      - value: "ML training"
      - value: "physics analysis"
      - value: "benchmarking"
      - value: "visualization"
  
  permitted_use:
    range: string
    required: false
    recommended: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Uses this dataset is suitable for, beyond the intended use.
      Genesis governance expects explicit permitted use metadata at the governance level,
      which is why this field is distinct from intended_use.
      Be explicit about what this dataset is suitable for, to guide users and prevent misuse.
    examples:
      - value: "AI workflows"
      - value: "research and publication"
      - value: "internal analysis"
      - value: "educational use"

  out_of_scope_use:
    range: string
    required: false
    recommended: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Uses this dataset should NOT be applied to.
    examples:
      - value: "clinical decision-making"
      - value: "real-time control systems"

  prohibited_use:
    range: string
    required: false
    recommended: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Uses that are explicitly prohibited for this dataset, either due to ethical considerations, safety concerns, or other governance reasons.
      Be explicit about what this dataset should not be used for, to guide users and prevent misuse.
    examples:
      - value: "commercial use"
      - value: "AI workflows"
      - value: "redistribution"
      - value: "use by foreign nationals"
      - value: "clinical decision-making"
      - value: "real-time control systems"

  limitations:
    range: string
    in_subset:
      - discoverability_if_applicable
    recommended: true
    description: >-
      Known limitations, gaps, or caveats users should be aware of before using this dataset.

  keywords:
    range: string
    multivalued: true
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Terms that describe this dataset and aid discovery.
      Include domain terms, methods, instruments, and relevant ontology terms.
  
  object_type:
    range: ObjectTypeEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Primary type of digital object described by this datacard.

  product_type:
    range: ProductTypeEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Replace default value if necessary with the extended from OSTI Product Types.
      Select the single best-fit.
    ifabsent: string(Dataset)
     
  dataset_type:
    range: DatasetTypeEnum
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      OSTI DOE Dataset Type code. Only valid value is "Instrument" for datasets that are instrument data products.
      If the dataset is not an instrument data product, this field should be null.

  release_status:
    range: ReleaseStatusEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      The release status of the dataset
      This provides important context about the lifecycle stage of the dataset 
      and can inform users about its readiness for use.

  classified_status:
    range: YesNoEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Indicates whether the asset is classified.

  classification_level:
    range: ClassificationLevelEnum
    required: false
    in_subset:
      - situational_required
    description: >-
      Official classification level, if the asset is classified.
      Required if classified_status is "Yes".

  classification_category:
    range: ClassificationCategoryEnum
    required: false
    multivalued: true
    list_elements_unique: true
    minimum_cardinality: 1
    in_subset:
      - situational_required
    description: >-
      Official classification category, if the asset is classified.
      Required if classified_status = "Yes".
      If present, at least one specified category must be included.

  classified_control_markings:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Additional classified dissemination/caveat/handling markings appearing with
      classified content.
      List all that apply, each as a separate entry. 
      This provides important context for handling and access controls for classified assets.
    examples:
      - value: "NOFORN"
      - value: "CNWDI"
      - value: "SIGMA 15"
      - value: "ORCON"
      - value: "REL TO USA, GBR"

  cui_status:
    range: YesNoEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Indicates whether the asset is Controlled Unclassified Information (CUI).

  cui_basic_categories:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Basic CUI categories applicable to this asset, if it is CUI.
      Use the DOE/ISOO-authoritative CUI Basic categories or subcategories.
      List all that apply, each as a separate entry. 
      This provides important context for handling and access controls for CUI assets.

  cui_specified_categories:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - situational_required
    description: >-
      Specified CUI categories applicable to this asset, if it is CUI.
      At least one specified category is required if cui_status = "Yes" or ucni_status = "Yes".
      If present, at least one specified category must be included.
      Use the DOE/ISOO-authoritative CUI Specified categories or subcategories.
      List all that apply, each as a separate entry. 
      This provides important context for handling and access controls for CUI assets.

  cui_limited_dissemination_controls:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Applicable CUI limited dissemination controls.
      Ordering/formatting should follow authoritative agency guidance.
      If cui_limited_dissemination_controls contains NOFORN, REL TO..., DISPLAY ONLY...,
      or similar controls, then governed_use.non_sensitivity_governance_metadata.foreign_national_access_status should be consistent with those controls.
    examples:
      - value: "NOFORN"
      - value: "REL TO USA, GBR"
      - value: "DISPLAY ONLY USA, GBR"
      - value: "RELIDO"
      - value: "[other authoritative values.]"

  ucni_status:
    range: YesNoEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Indicates whether the asset contains UCNI. UCNI is represented separately
      and should not be treated as an ordinary CUI category value.
      This provides important context for handling and access controls for UCNI assets.

  uk_mda_status:
    range: UKMDAStatusEnum
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Indicates whether the asset is subject to UK Ministry of Defence Assessment (MDA)-specific handling.
      Optional and may be used where relevant to local/site governance.

  legacy_label_source:
    range: string
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Preserves deprecated or local historical control labels such as OUO, SBU, 
      or site-specific legacy markings as provenance/source information only.
      If source_marking_scheme = Legacy_OUO, legacy_label_source should be populated
      with the corresponding legacy OUO labels.
      Provide as a list of unique entries if multiple legacy labels apply.
    examples:
      - value: "OUO"
      - value: "SBU"
      - value: "Legacy_Site_Marking"

  normalized_control_basis:
    range: NormalizedControlBasisEnum
    multivalued: true
    list_elements_unique: true
    required: false
    minimum_cardinality: 1
    in_subset:
      - discoverability_if_applicable
    description: >-
      Optional interpreted control basis used for governance where source materials
      contain legacy, mixed, or non-standard constructs. 
      If present, it must be populated with at least one value.
      Provide as a list of unique entries if multiple control bases apply.
      This does not replace authoritative source markings.
      If source_marking_scheme = Legacy_OUO and the legacy marking is unresolved to a current standard marking, 
      this should be populated as "Legacy_Needs_Mapping" to indicate that the control basis is legacy and needs 
      interpretation for governance purposes.

  workflow:
    range: WorkflowClass
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Describes the technical and processing lifecycle position of the dataset. 
      discoverability.workflow.state — describes the technical/processing lifecycle position of the data itself (raw → archived)
      reusability.release_status — describes the publication and governance state of the dataset record (draft → deprecated)
      These should be logically consistent. Common alignments:
      discoverability.workflow.state=Raw|Processing|QA|Analysis → reusability.release_status=Draft
      discoverability.workflow.state=Review → reusability.release_status=Under_Review
      discoverability.workflow.state=Embargo|Published → reusability.release_status=Approved|Published
      discoverability.workflow.state=Archived → reusability.release_status=Deprecated|Published

  state:
    range: StateEnum
    required: true
    in_subset:
      - discoverability_required
    description: >-
      Current lifecycle position of the data itself, following StateEnum controlled vocabulary.

  is_intermediate:
    range: YesNoEnum
    recommended: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Whether this dataset is an intermediate output, as opposed to a final deliverable.
      "No" if this is final.

  pipeline_stage:
    range: string
    recommended: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Freetext position in processing pipeline.
    examples:
      - value: "raw telemetry, pre-calibration"
      - value: "post-detector, pre-reconstruction"
      - value: "post-reconstruction, pre-analysis"
  
  embargo_until:
    range: date
    required: false
    in_subset:
      - situational_required
    description: >-
      Required if state=Embargo. ISO 8601 date after which release is permitted.

  access_policy:
    range: AccessPolicyClass
    inlined: true
    in_subset:
      - accessibility_required
    description: >-
      Describes who can access this dataset and under what conditions.
      access_policy.access_level describes the dataset's access
      sensitivity — the same subject as sensitivity.overall_sensitivity.
      Reproduced here for access control systems that evaluate this block independently.
      See NOTE ON SENSITIVITY TIERS above.

  access_level:
    range: AccessLevelEnum
    required: true
    in_subset:
      - accessibility_required
    description: >-
      The access level of the dataset.
      This provides important context about who can access the dataset and can inform users about potential barriers to access and use.
      This does not replace the authoritative source markings and metadata fields for classification, CUI, or other sensitivity designations, 
      which should still be filled out based on the authoritative source markings.

  access_restrictions:
    range: string
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      Freetext description of any specific access restrictions or requirements for the dataset,
      beyond what is indicated by the classification and sensitivity markings.
      This can provide more detailed information about who is allowed to access the 
      dataset and under what conditions, which can inform users about potential barriers to access and use.
    examples:
      - value: "Requires signed DUA"
      - value: "None - publicly accessible"
      - value: "Access limited to cleared personnel with need-to-know"
      - value: "Requires two-factor authentication and secure VPN access"

  authorization_required:
    range: AuthorizationRequiredEnum
    required: false
    multivalued: true
    in_subset:
      - accessibility_if_applicable
    description: >-
      List of authorizations required.
      When formal authorization is required to access the datase.
  
  intended_partner_classes:
    range: IntendedPartnerClassEnum
    multivalued: true
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      The intended partner classes/types (list) that are expected to access and use this dataset,
      if applicable. If absent, or null, this field is not yet known or determined. 
      Use an empty list if definitively no specific partner classes are targeted.
      Use Public if this dataset is intended for broad public use without restrictions.

  approved_environments:
    range: ApprovedEnvironmentEnum
    multivalued: true
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      Approved environments for accessing or using the dataset, if applicable.
      Use an empty list ([]) if there are no specific approved environments or if the dataset is publicly accessible.
      null or absent means it has not yet been determined whether approved environments are required.
      This can inform users about where they are allowed to access and use the dataset, 
      which can be important for compliance with security requirements.

  policy_url:
    range: string
    pattern: '^https?://.+$|^not_applicable$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      URL to the official access policy or data use agreement governing this dataset.
      This can provide users with direct access to the full terms and conditions for using the dataset,
      which can inform their understanding of legal and ethical requirements.
  
  policy_text:
    range: string
    in_subset:
      - accessibility_if_applicable
    description: >-
      Inline summary if no policy_url exists.
      This can provide users with a quick overview of the key terms and conditions 
      for using the dataset, which can inform their understanding of legal and ethical requirements.
    related_mappings:
      - fair4ml:legal

  license:
    range: LicenseClass
    inlined: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Block to capture a license under which the dataset is released.
      This indicates the legal permissions and restrictions associated with using the dataset and can inform users about how
      they are allowed to use, share, and build upon the data.
      A public/open license is not always the governing instrument for use,
      some controlled datasets may not have an SPDX-style reuse license at all,
      and use may instead be governed by contract, agreement, institutional review, or repository policy.
  
  spdx_id:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      The SPDX license identifier for the dataset, use the SPDX license identifier: https://spdx.org/licenses/
      Use "Other" if not in SPDX registry. 
      Use "Pending" if not yet assigned.
      This provides a standardized way to indicate the license for the dataset and can inform users about the legal permissions and restrictions associated with using the data.
    exact_mappings:
      - spar_datacite:RightsIdentifier
    examples:
      - value: "CC-BY-4.0"
      - value: "CC0-1.0"
      - value: "Apache-2.0"
      - value: "MIT"
      - value: "Other"
      - value: "Pending"

  url:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - reusability_if_applicable
    description: >-
      URL to a license.
      This can provide users with direct access to the full terms and conditions, 
      which can inform their understanding of legal and ethical requirements.

  known_contractual_rights:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Any known contractual rights or obligations associated with this dataset 
      that may not be fully captured by the license or access policy information.
      This can include information about data sharing agreements, 
      third-party restrictions, or other legal considerations that users should be 
      aware of when working with the dataset.
      DOE/NNSA datasets may have complex contractual arrangements that 
      impact how the data can be used and shared beyond license terms.
    examples:
      - value: "Government has unlimited rights"
      - value: "Contractor retains rights with government license"

  additional_licenses:
    range: LicenseClass
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Additional licenses governing this dataset, if multiple licenses apply.
      This can provide users with a more complete understanding of the legal permissions 
      and restrictions associated with using the dataset, 
      especially in cases where different parts of the dataset may be subject to different licenses.

  dataset_publisher:
    range: PublisherClass
    required: false
    inlined: true
    description: >-
      The publisher of the dataset, described by a name and ror_id if available.
      Required for datasets with release_status = Approved | Published
      This provides important provenance information about the dataset and can inform trust and maintenance practices.
    in_subset:
      - situational_required

  contact:
    range: ContactClass
    required: true
    multivalued: true
    inlined: true
    in_subset:
      - discoverability_required
    description: >-
      Contact information for questions about access to or use of this dataset.
      This can provide users with a direct point of contact for inquiries about the dataset, which can facilitate
      communication and support responsible use of the data.
      Perfer a person, but an organization can be provided.

  valid_until:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - discoverability_if_applicable
    description: >-
      Date after which this contact may no longer be valid., in ISO 8601 format (YYYY-MM-DD).
      Use for project-bound contacts (students, postdocs, term staff).
  
  succession_note:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: >-
      Who to contact if this contact is no longer reachable.
    examples:
      - value: "Contact the ORNL data management office at data@ornl.gov"
  
  additional_contacts:
    range: ContactClass
    multivalued: true
    inlined: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      Additional contacts such as an instrument PI, data steward, or other relevant individuals.
      Can include person or organization agent_types for the Contact.

  authors:
    range: AgentClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    list_elements_unique: true
    in_subset:
      - discoverability_required
    description: "At least one author required when release_status = Approved | Published."

  contributors:
    range: AgentClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: false
    list_elements_unique: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Supporting contributors who are not primary authors.
      e.g., sample preparers, annotators, reviewers, submitters.
      For draft or in-workflow data, populate with known contributors.
  
  sponsor_organizations:
    range: SponsorOrganizationClass
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - discoverability_required
    description: "Organizations that funded or sponsored this dataset."

  award_number:
    range: string
    recommended: true
    in_subset:
      - discoverability_if_applicable
    description: "Award number(s) associated with the funding for this dataset."
    examples:
      - value: "DE-AC05-00OR22725"

  funding_source:
    range: FundingSourceEnum
    recommended: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Funder or sponsor of the research that produced this dataset.

  program:
    range: string
    recommended: true
    in_subset:
      - discoverability_if_applicable
    description: "The program or initiative under which this dataset was created."
    examples:
      - value: "Advanced Scientific Computing Research"
      - value: "Predictive Science Academic Alliance Program"
      - value: "Fusion Energy Sciences"

  sponsoring_doe_program_office:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: "The DOE program office that sponsored or funded the research that produced this dataset."
    examples:
      - value: "Office of Science"
      - value: "National Nuclear Security Administration"
      - value: "Office of Energy Efficiency and Renewable Energy"

  sponsoring_doe_subprogram:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: "The DOE subprogram that sponsored or funded the research that produced this dataset."
    examples:
      - value: "Advanced Scientific Computing Research"
      - value: "Predictive Science Academic Alliance Program"
      - value: "Fusion Energy Sciences"

  research_organizations:
    range: ResearchOrganizationClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: true
    in_subset:
      - discoverability_required
    description: "Organizations that created or collected the data."
  
  facilities:
    range: FacilityClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: false
    in_subset:
      - discoverability_if_applicable
    description: >-
      User facilities, HPC centers, or research infrastructure
      used to collect, process, or store the dataset.
  
  facility:
    range: FacilityClass
    description: "A user facility, HPC center, or research infrastructure used to collect, process, or store the dataset."

  location:
    range: LocationClass
    in_subset:
      - discoverability_if_applicable
    description: >-
      Point location for facility-based experimental data, if applicable.
      description: should include the place name and, location details.
    examples:
      - value: "SNS Beamline 1B, Oak Ridge National Laboratory, TN, USA"
  
  science_domain:
    range: ScienceDomainEnum
    multivalued: true
    in_subset:
      - discoverability_if_applicable
    description: >-
      Based on OSTI Subject Areas, scientific domains or disciplines this dataset primarily relates to.
      Extends the the list of OSTI Subject Areas with an Other category for datasets that do not fit into the OSTI list.
      Those using E-Link can map to their own taxonomy.
  
  tags:
    range: TagsClass
    in_subset:
      - discoverability_if_applicable
    description: >-
      Structured tags block for catalog filtering and discovery, 
      including project, science, object_type.
  
  science:
    range: string
    in_subset:
      - discoverability_if_applicable
    description: >-
      More specific scientific domain, sub-discipline, or topic.
    examples:
      - value: lightsource
      - value: fusion
      - value: materials
      - value: biology
      - value: synchrotron light source science
      - value: magnetic confinement fusion
      - value: materials under extreme conditions

  task_category:
    range: string
    required: false
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    aliases:
        - task
        - ml_task
        - mlTask
    in_subset:
      - discoverability_if_applicable
    description: >-
      Primary task category or categories for this dataset.
      Helps ML practitioners find relevant datasets in the catalog.
    exact_mappings:
      fair4ml:mlTask
    examples:
      - value: classification
      - value: regression
      - value: segmentation
      - value: detection
      - value: generation
      - value: translation
      - value: summarization
      - value: ranking
      - value: anomaly_detection
      - value: clustering
      - value: reinforcement_learning
      - value: other

  task_subcategory:
    range: string
    required: false
    multivalued: true
    inlined_as_list: true
    aliases:
        - task_sub
        - ml_task_sub
        - ml_sub_task
    in_subset:
      - discoverability_if_applicable
    description: >-
      More specific task subcategory or subcategories.
    examples:
      - value: binary_classification
      - value: multi_class_classification
      - value: multi_label_classification
      - value: image_segmentation
      - value: object_detection
      - value: time_series_forecasting
      - value: named_entity_recognition
      - value: question_answering
  
  data_structure:
    range: DataStructureClass
    inlined: true
    required: false
    in_subset:
      - interoperability_required
    description: "Fields describing the format, encoding, and structure of the dataset."
  
  formats:
    range: string
    multivalued: true
    in_subset:
      - interoperability_required
    description: >-
      File formats included in this dataset.
    examples:
      - value: csv
      - value: json
      - value: parquet
      - value: hdf5
      - value: netcdf
      - value: jpeg
      - value: png
      - value: tiff
      - value: wav
      - value: mp3
      - value: mp4
      - value: avi
      - value: application/octet-stream
      - value: binary

  encoding:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Character encoding for text-based formats.
      UTF-8 strongly recommended. Use not_applicable for binary formats.
    examples:
      - value: UTF-8
      - value: ASCII
      - value: Latin-1
      - value: not_applicable
  
  schema_version:
    range: string
    pattern: '^\d+\.\d+(\.\d+)?$|^not_applicable$'
    in_subset:
      - interoperability_if_applicable
    description: >-
      Version of the data schema used in this dataset.
      Distinct from datacard_version. Increment when the data schema changes, 
      even if the datacard version remains the same.
  
  modalities:
    range: string
    required: true
    multivalued: true
    inlined_as_list: true
    in_subset:
      - interoperability_required
    description: >-
      Data modalities present.
    examples:
      - value: tabular
      - value: image
      - value: time-series
      - value: text
      - value: graph
      - value: point-cloud

  features:
    range: FeatureClass
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_required
    description: >-
      Primary variables, fields, or features.
      IMPORTANT: choose ONE form and use it consistently — do not mix.
      For basic discoverability — flat string list: e.g., 
        name: temperature
        name: pressure
        name: timestamp
        name: label
      To enhance interoperability, reuse, and AI-readiness (replace flat list above).
        - name: temperature
            description: Sample temperature at time of measurement
            data_type: float
            unit: Kelvin
            range: "273.15 - 373.15"

  feature:
    range: FeatureClass
    description: >-
      A block for capturing information about the dataset's features, variables, or fields.
      A primary variable, field, or feature in the dataset.
      Can be represented as a simple string for core/extended profiles 
        name: temperature
      or as a structured block for AI agent use profile.
        name: temperature
          description: Sample temperature at time of measurement
          data_type: float           # float | int | string | boolean | datetime | other
          unit: Kelvin
          range: "273.15 - 373.15"
  
  unit:
    range: string
    in_subset:
      - interoperability_if_applicable
    exact_mappings:
      - schema:unitText
    description: >-
      The unit of measurement for a feature.
      This can provide important context for interpreting the values of the feature.

  data_type:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      The data type of a feature or variable, following a controlled vocabulary from  (e.g., float, int, string, boolean, datetime, other).
      This can provide important information about the nature of the data and can inform users about how to interpret and work with the dataset.
    related_mappings:
      - schema:valueReference

  splits:
    range: string
    multivalued: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Dataset splits if pre-divided.
      Information about splits within the dataset.
      This can provide important context for how the dataset is structured for data-driven modeling 
      and can inform users about how to use the data effectively for model training and evaluation.
      e.g., train | test | validation.
    examples:
      - value: train
      - value: test
      - value: validation

  range:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      The range of values for a feature.
      This can provide important information about the expected values for a feature 
      and can inform users about how to work with the data effectively.

  spatial_coverage:
    range: SpatialCoverageClass
    required: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Spatial coverage block for geospatial datasets, if applicable.
      This can include a description and slots for the bounding box coordinates.
      such as bounding boxes, place names, or other location-based metadata that can inform users 
      about the spatial context of the data.

  geo_location_box:
    range: GeoLocationBoxClass
    in_subset:
      - interoperability_if_applicable
    description: >-
      Geographic bounding box for geospatial datasets, if applicable.
      Container for elements describing the west_bound_longitude, east_bound_longitude, south_bound_latitude, and north_bound_latitude in decimal degrees.
      e.g., west_bound_longitude: -125.0, east_bound_longitude: -66.5, south_bound_latitude: 24.0, north_bound_latitude: 49.0 for continental US
    related_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  west_bound_longitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Westernmost longitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite_geo:westboundlongitude
    related_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  east_bound_longitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Easternmost longitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite_geo:eastboundlongitude
    related_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  south_bound_latitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Southernmost latitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite_geo:southboundlatitude
    related_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  north_bound_latitude:
    range: float
    in_subset:
      - interoperability_if_applicable
    description: "Northernmost latitude in decimal degrees for geospatial datasets."
    exact_mappings:
      - datacite_geo:northboundlatitude
    related_mappings:
      - schema:spatialCoverage
      - dcterms:spatial

  temporal_coverage:
    range: TemporalCoverageClass
    required: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Temporal coverage for time-based datasets, if applicable.
      Container for elements describing the start_date and end_date of the dataset's temporal coverage in ISO 8601 format (YYYY-MM-DD).
      NOTE: distinct from dates.data_collection_start/end, which describe
      when collection occurred. Use temporal_coverage when the dataset
      describes a specific historical or projected time period that differs
      from when collection happened.
      e.g., start_date: 2020-01-01, end_date: 2020-12-31 for a dataset covering the year 2020.
    related_mappings:
      - dcterms:temporal
      - schema:temporalCoverage
  
  start_date:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "Start date of the dataset's temporal coverage in ISO 8601 format (YYYY-MM-DD)."
    related_mappings:
      - schema:temporalCoverage
    narrow_mappings:
      - dcterms:date

  end_date:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "End date of the dataset's temporal coverage in ISO 8601 format (YYYY-MM-DD)."
    related_mappings:
      - schema:temporalCoverage
    narrow_mappings:
      - dcterms:date

  dataset_scale:
    range: DatasetScaleClass
    inlined: true
    required: false
    in_subset:
      - accessibility_if_applicable
    description: >-
      These fields describe the scale of the dataset, w
      hich is important for users to understand the scope and potential 
      resource requirements for using the dataset. 
    broad_mappings:
      - schema:size
      - dcterms:extent

  record_count:
    range: integer
    in_subset:
      - accessibility_if_applicable
    description: "The number of records or rows in the dataset."
    broad_mappings:
      - schema:size
      - dcterms:extent
  
  record_unit:
    range: string
    in_subset:
      - accessibility_if_applicable
    description: "The unit of measurement for the record count, such as samples, files, records, timesteps, images, tokens, other)."

  compressed_bytes:
    range: integer
    in_subset:
      - accessibility_if_applicable
    description: "The size of the dataset in bytes when compressed."
    broad_mappings:
      - schema:size
      - dcterms:extent
      - dcat:byteSize

  uncompressed_bytes:
    range: integer
    in_subset:
      - accessibility_if_applicable
    description: "The size of the dataset in bytes when uncompressed."
    broad_mappings:
      - schema:size
      - dcterms:extent
      - dcat:byteSize

  dates:
    range: DatesClass
    inlined: true
    required: false
    in_subset:
      - interoperability_if_applicable
    description: "Fields for important dataset dates metadata, including collection, issued, and modified dates."

  data_collection_start:
    range: date
    in_subset:
      - interoperability_if_applicable
    description: "The date when data collection for this dataset started, in ISO 8601 format (YYYY-MM-DD)."
    exact_mappings:
      - prov:startedAtTime
    broad_mappings:
      - schema:date
      - dcterms:date

  data_collection_end:
    range: date
    in_subset:
      - interoperability_if_applicable
    description: "The date when data collection for this dataset ended, in ISO 8601 format (YYYY-MM-DD)."
    exact_mappings:
      - prov:endedAtTime
    broad_mappings:
      - schema:date
      - dcterms:date

  issued:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "The ISO 8601 (YYYY-MM-DD) date the dataset was first publicly released."
    exact_mappings:
      - dcterms:issued
    close_mappings:
      - schema:datePublished

  modified:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - interoperability_if_applicable
    description: "The ISO 8601 (YYYY-MM-DD) date the dataset was most recently modified."
    exact_mappings:
      - dcterms:modified
      - schema:dateModified

  access:
    range: AccessClass
    inlined: true
    in_subset:
      - accessibility_required
    description: >-
      Access Endpoints information. 
      This can include the current location/landingpage, and intended repository information, 
      such as access instructions and APIs.
      Intended to provide information on how to access the dataset for humans and machines.

  current_location:
    range: string
    required: true
    in_subset:
      - accessibility_required
    description: >-
      Where the data physically resides right now.
      Use for in-workflow data not yet deposited in a repository, 
      or for any dataset with a known internal or external storage path.
    related_mappings:
      - dcat:Distribution
    close_mappings:
      - dcat:distribution
    examples:
      - value: "/mnt/ecs/scientific-data/project/dataset/"
      - value: "/lustre/orion/proj-shared/dataset/"
      - value: "s3://genesis-bucket/dataset/"
  
  publicly_facing_landing_page_url:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      A publicly facing URL that provides information about the dataset and how to access it.
      It may differ from the current_location if the dataset is not yet publicly released or if the current_location is an internal storage path.
      This can provide users with a direct point of access for learning more about the dataset and how to obtain it.
    exact_mappings:
      - dcat:landingPage

  intended_repositories:
    range: IntendedRepositoryClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - accessibility_if_applicable
    description: >-
      Repositories you intend to deposit or have deposited this dataset in. 
      The managing repository or catalog system will
      resolve and populate repository-assigned fields at ingest (see repository_managed slot). 
      Repositories may be institutional, project-owned, community, or national 
      (e.g., Zenodo, institutional data repository, project data store).
  
  is_primary:
    range: YesNoEnum
    in_subset:
      - accessibility_if_applicable
    description: >-
      Whether this is the primary or authoritative location for the dataset.
      Only one IntendedRepository should be marked as primary. 
      This can help users identify the most reliable or official source for accessing the dataset, 
      especially if there are multiple access points or repositories where the data is available.

  date_deposited:
    range: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      The date when the dataset was deposited in the repository, in ISO 8601 format (YYYY-MM-DD).
      Can inform users about the currency of the data.
  
  data_services:
    range: DataServiceClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    required: false
    in_subset:
      - accessibility_if_applicable
    close_mappings:
      - dcat:DataService
    description: >-
      APIs available for accessing the dataset, if any.
      This can provide users with information about programmatic access options for the dataset, 
      which can facilitate integration into workflows.

  endpoint:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      The URL or connection string for an API endpoint that provides access to the dataset.
      Provide users with direct access to programmatic interfaces for working with the dataset.
      Useful for enabling machine-actionable data documentation.
    exact_mappings:
      - dcat:endpointURL
    close_mappings:
      - schema:WebAPI
  
  documentation_url:
    range: string
    pattern: '^https?://.+$'
    in_subset:
      - accessibility_if_applicable
    description: >-
      URL to documentation for the API or access method.
      This can provide users with important information about how to use the API or access method effectively, 
      which can facilitate integration into AI/ML workflows and other data processing pipelines.
      Useful for enabling machine-actionable data documentation.

  authentication:
    range: AuthenticationTypeEnum
    in_subset:
      - accessibility_if_applicable
    description: >-
      Whether authentication is required to access the dataset through this endpoint.
      Informs users about potential barriers to access and can help them prepare \
      for any necessary credentials or permissions needed to work with the dataset.
  
  rate_limit:
    range: string
    in_subset:
      - accessibility_if_applicable
    description: >-
      Any rate limits or access restrictions for the API endpoint.
      Informs users about potential limitations on how frequently they can access the dataset 
      through the API, which can help them plan their data processing and analysis workflows accordingly.
    examples:
      - value: "1000 requests/hour"
      - value: "5000 requests/day"
      - value: "1000 requests/hour and no more than 100 concurrent connections"
  
  provenance:
    range: ProvenanceClass
    required: true
    inlined: true
    in_subset:
      - interoperability_required
    description: >-
      Provenance information about the dataset, including its origin, history, 
      and any transformations/processing it has undergone.
      Provides important context for understanding the dataset and can inform users 
      about its reliability and suitability for their intended use and facilitate reuse 
      and reproducibility.
  
  was_generated_by:
    range: string
    required: true
    in_subset:
      - interoperability_required
    description: >-
      High-level description of the generating process.
      Even a one-line answer dramatically improves catalog value.
    exact_mappings:
      - prov:wasGeneratedBy
    examples:
      - value: "Neutron scattering experiment at SNS Beamline 1B"
      - value: "Monte Carlo simulation using MCNP 6.2"
      - value: "Derived from raw telemetry via calibration pipeline v2.1"
  
  source_data:
    range: SourceDatasetClass
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Source datasets this dataset was derived from. 
      Captures the relationship and provenance information 
      about the source datasets.
    related_mappings:
      - dcterms:source

  relationship:
    range: RelationshipTypeEnum
    in_subset:
      - interoperability_if_applicable
    description: >-
      Relationship to other datasets or resources.
      This can include links to related datasets, publications, software, or other resources 
      that are relevant to understanding and using the dataset effectively.

  processing_steps:
    range: string
    required: true
    multivalued: false
    in_subset:
      - interoperability_required
    description: >-
      Key processing, cleaning, calibration, or transformation steps applied to produce this dataset.
      Describe any processing steps, transformations, or cleaning that have been applied to the dataset.
      This can provide important context for understanding the dataset and can inform users 
      about its reliability and suitability for their intended use.
  
  instrumentation:
    range: string
    multivalued: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Instruments, sensors, detectors, or equipment used to collect the data, if applicable.
      Include make, model, and version where relevant.
      This can provide important context for understanding the dataset.
    examples:
      - value: "Neutron scattering experiment using a He-3 position-sensitive detector at SNS Beamline 1B"
      - value: "Data collected using a Tektronix TDS2024C oscilloscope"
      - value: "Satellite remote sensing data from the MODIS instrument on the Terra satellite"

  simulation_details:
    range: string
    multivalued: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      For simulation-derived data: code, simulation setup, version, key parameters, and configuration for simulated datasets, if applicable.
      This can provide important context for understanding the dataset and can inform users about its reliability and suitability for their intended use.
    examples:
      - value: "Monte Carlo simulation using MCNP 6.2 with a 10x10x10 grid, 1 million particles, and physics models X, Y, Z"
      - value: "Molecular dynamics simulation using LAMMPS version 3Mar2020 with the following input script: ..."
      - value: "Climate model simulation using the Community Earth System Model (CESM) version 2.1 with the following configuration: ..."
  
  software_environment:
    range: SoftwareEnvironmentClass
    in_subset:
      - interoperability_if_applicable
    description: >-
      Software environment block used to generate or process this dataset, 
      Captures details about os, container, and hpc environment.
      Captures what is needed for computational reproducibility, including software environment details 
      for datasets that are generated or processed using specific software tools.

  os:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Operating system used in the software environment for generating or processing this dataset.
    examples:
      - value: "RHEL 8.6"
      - value: "Ubuntu 22.04"
  
  compiler:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Compiler used in the software environment for generating or processing this dataset.
    examples:
      - value: "GCC 11.3.0"
      - value: "Intel oneAPI 2023.1"
      - value: "Clang 14.0.6"
  
  container:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Containerization technology used in the software environment 
      for generating or processing this dataset.
    examples:
      - value: "docker://registry/image:tag"
      - value: "singularity://registry/image:tag"
      - value: "Docker 20.10.12"
      - value: "Singularity 3.8.7"

  hpc_environment:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      HPC environment or platform used in the software environment for generating 
      or processing this dataset.
    examples:
      - value: "Orion HPC at Oak Ridge National Laboratory sourcing the following environment modules: python/3.10, cuda/11.8, openmpi/4.1"
      - value: "Summit HPC at Oak Ridge National Laboratory sourcing the following environment modules: python/3.9, cuda/11.4, openmpi/4.0"
      - value: "NERSC Cori supercomputer using the following environment modules: python/3.8, cuda/11.2, openmpi/4.0"

  notes:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      Additional environment details, key library versions, or reference to a full environment manifest.
    examples:
      - value: "See requirements.txt in dataset root"
      - value: "numpy 1.24, pytorch 2.0.1, h5py 3.8.0"

  stewardship:
    range: StewardshipClass
    inlined: true
    in_subset:
      - reusability_if_applicable
    description: >-
      Stewardship & Versioning metadata to capture information about dataset maintenance, updates, versioning, and reviews.
      This can provide users with important information about how the dataset is maintained and updated over time.
      NOTE ON VERSIONING: Three fields work together to describe versioning:
      discoverability.identification.version — the version number of this dataset;
      discoverability.identification.supersedes /
      discoverability.identification.superseded_by  — links to prior and successor versions;
      reusability.stewardship.versioning_strategy — how versioning is managed over time.

  level:
    range: StewardshipLevelEnum
    in_subset:
      - reusability_if_applicable
    description: >-
      The level of stewardship for this dataset.

  maintainer:
    range: MaintainerAgentClass
    inlined: true
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Person or organization responsible for ongoing maintenance of the dataset over time, if different from the contact.
      This can provide users with a point of contact for ongoing maintenance and updates to the dataset, 
      which can facilitate communication and support responsible use of the data.
  
  update_frequency:
    range: UpdateFrequencyEnum
    in_subset:
      - reusability_if_applicable
    description: >-
      How often the dataset is updated or expected to be updated, if applicable.
  
  retention_policy:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the dataset's retention policy, including how long the dataset will be retained 
      and any conditions for its removal or archiving.
      Provides users with important information about the longevity of the dataset 
      and can inform their decisions about using and citing the data.
    examples:
      - value: "Retained for 10 years per DOE data management policy"

  versioning_strategy:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the dataset's versioning strategy, including how new versions are created and managed over time.      
      NOTE ON VERSIONING: Three fields work together to describe versioning:
      discoverability.identification.version — the version number of this dataset;
      discoverability.identification.supersedes /
      discoverability.identification.superseded_by  — links to prior and successor versions;
      reusability.stewardship.versioning_strategy — how versioning is managed over time.
      This can provide users with important information about how the dataset evolves over time.
    examples:
      - value: "New version created for each major update; minor updates appended to existing version with date suffix"
      - value: "Semantic versioning; all versions retained in Zenodo"
      - value: "Major versions only; prior versions available on request"

  review_provenance_companion:
    range: SpecificReviewClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Reviews or assessments of the dataset, if any.
      Running history of all formal reviews. Add one entry per review stage in chronological order. Do not overwrite
      earlier entries when adding new ones.
      This block extends the Genesis Sensitivity V2 review_provenance_companion (which only accepts a single review) by allowing multiple review records to be captured in a structured format, 
      which is especially useful for datasets that have undergone multiple reviews or have complex provenance histories.
      Provides users with insights into the quality and reliability of the dataset.

  source_review_reference:
    identifier: true
    range: string
    recommended: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Identifier or citation for the authoritative review/release/source document.
    examples:
      - value: "internal_qa"
      - value: "security"
      - value: "export_control"
      - value: "irb"
      - value: "quality_assessment"
      - value: "partner"
      - value: "publication"
      - value: "other"
  
  review_purpose:
    range: string
    in_subset:
      - governed_use_if_applicable
    recommended: true
    description: >-
      The purpose or focus of the review, such as export control, IRB, security, quality assessment, or other.      
      Provides users with important context about the nature of the review and what aspects of the dataset were evaluated, 
      which can inform their understanding of the dataset's quality and reliability.
    examples:
      - value: "Export control review prior to public release"
      - value: "Institutional Review Board (IRB) review for human subjects research"
      - value: "Internal security review for sensitive data handling"
      - value: "Quality assessment review for data integrity and accuracy"

  source_review_authority:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Office, system, or authority of record for the source sensitivity determination.
      Provides users with information about the official authority responsible for the review, 
      which can inform their confidence in the dataset's quality and reliability.
    examples:
      - value: "DOE Office of Export Control"
      - value: "Institutional Review Board at XYZ University"
      - value: "Internal security review board"

  review_contact_name:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Human point of contact, if appropriate to capture.
      This can provide users with a point of contact for questions about the review process and its outcomes, 
      which can facilitate communication and support responsible use of the data.

  review_contact_email:
    range: string
    in_subset:
      - governed_use_if_applicable
    description: >-
      Contact email, if appropriate to capture.
      Provides users with a point of contact for questions about the review process and its outcomes, 
      which can facilitate communication and support responsible use of the data.
  
  reviewed_by:
    range: AgentClass
    inlined: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Person or role responsible for conducting the review, if applicable.
      Provides users with information about the expertise and credibility of the reviewers, 
      which can inform their confidence in the dataset's quality and reliability.

  decontrol_or_declassify_on:
    range: string
    pattern: '^(\d{4}-\d{2}-\d{2}|not_applicable)$'
    in_subset:
      - governed_use_if_applicable
    description: >-
      For sensitive datasets, the date when the dataset can be decontrolled or declassified, if applicable.
      Provides users with information about when the dataset may become more widely available and can inform their decisions about using and citing the data.

  review_date:
    range: string
    pattern: '^(\d{4}-\d{2}-\d{2}|not_applicable)$'
    in_subset:
      - governed_use_if_applicable
    description: >-
      The date when the review was conducted or completed, in ISO 8601 format (YYYY-MM-DD).

  comments:
    range: string
    in_subset:
      - governed_use_if_applicable
    recommended: true
    description: >-
      Additional comments or notes about the review, if any.
      Provides insights about the review process and its outcomes.
  
  related_resources:
    range: RelatedResourcesClass
    inlined: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Related Resources:
      Links to related datasets, publications, software, and AI models. 

  datasets:
    range: DatasetClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Related datasets, if any. 
      This can include links to other datasets that are relevant to understanding and using the dataset effectively, 
      such as source datasets, derived datasets, or complementary datasets.

  publications:
    range: PublicationIdentifierClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Publications associated with this dataset, if any. 
      This can include links to scholarly articles, conference papers, or other publications that describe the dataset or its use, 
      which can provide users with additional context and insights about the dataset.

  identifiers:
    range: PublicationIdentifierClass
    multivalued: true
    inlined: true
    inlined_as_list: true

  software:
    range: SoftwareClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - if_applicable
    description: >-
      Software associated with this dataset, if any. 
      This can include links to software tools, libraries, or frameworks that were used to generate, process, or analyze the dataset, 
      which can provide users with additional context and insights about the dataset.

  ai_models:
    range: AIModelClass
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      AI models associated with this dataset, if any. 
      This can include links to AI models that were trained on, evaluated using, or otherwise related to the dataset, 
      which can provide users with additional context and insights about the dataset.
  
  domain_metadata:
    range: DomainMetadataClass
    inlined: true
    inlined_as_list: true
    required: false
    in_subset:
      - interoperability_if_applicable
    description: >-
      Captures domain-specific metadata that may be relevant for understanding and using the dataset effectively.
      This can include fields that are specific to certain scientific domains or types of data, 
      which can provide users with important context and insights about the dataset.
      Domain-specific metadata fields supplement the supports_discoverability card
      and should not replace the common metadata expected by the datacard.

  schema_reference:
    range: SchemaReferenceClass
    in_subset:
      - interoperability_if_applicable
    description: >-
      Reference to a schema or controlled vocabulary that defines the domain-specific metadata fields used in the domain_metadata block.
      This can provide users with information about the structure and semantics of the domain-specific metadata, 
      which can inform their understanding of the dataset and how to work with the domain-specific metadata.

  fields:
    description: Field names, their corresponding values, data types, units, and descriptions for domain-specific metadata.
    range: DomainMetadataFieldValueClass
    multivalued: true
    inlined: true
    inlined_as_list: true
  
  field_value:
    description: The value for a specific domain metadata field.
    range: string
    in_subset:
      - interoperability_if_applicable
  
  non_sensitivity_governance_metadata:
    range: NonSensitivityGovMetadataClass
    required: false
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Governance-relevant metadata that may affect 
      sharing/use decisions but is not part of the source sensitivity/marking block itself.
      This refers to the non-sensitivity governance as it applies to the dataset, 
      which may be distinct from the sensitivity or classification of the source data from which it was derived.

  export_control:
    range: ExportControlClass
    required: true
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Includes fields related to export control considerations for the dataset, if applicable.
      Provides users with important information about any export control restrictions or requirements that may apply to the dataset.

  export_control_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The export control status of the dataset.
  
  export_control_basis:
    range: ExportControlBasisEnum
    required: false
    in_subset:
      - situational_required
    description: >-
      The basis for the export control status.
      Required is `export_control_status` = "Yes".

  foreign_national_access_status:
    range: ForeignNationalAccessStatusEnum
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      Governance-facing outcome field indicating whether foreign national access
      is allowed, restricted, prohibited, or conditional, based on the combined
      effect of applicable export, classification, dissemination, agreement,
      or other source-authoritative constraints. This is not an export-only field.
  
  privacy:
    range: PrivacyClass
    required: true
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Includes fields related to privacy considerations for the dataset.
      Provides users with important information about any privacy restrictions or requirements that may apply to the dataset.

  privacy_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The privacy status of the dataset.
  
  pii_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether the dataset contains personally identifiable information (PII).  

  phi_status:
    range: YesNoPendingUnknownEnum
    required: true
    in_subset:
      - governed_use_if_applicable
    description: >-
      Whether the dataset contains protected health information (PHI).
      Use quotes to distinguish from boolean values.

  privacy_control_basis:
    range: PrivacyControlBasisEnum
    multivalued: true
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      The basis for the privacy status. 
      Be explicit about the privacy regime(s) - e.g. use "not_applicable" if no privacy regime applies.
  
  privacy_regime_notes:
    range: string
    required: false
    in_subset:
      - governed_use_if_applicable
    description: >-
      Optional notes for privacy regimes or handling nuances not captured by controlled values.
      Provides users with important context about the privacy considerations and requirements that may apply to the dataset.

  rights_release_records:
    range: RightsReleaseRecordsClass
    required: true
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Information about rights release records for the dataset.
      Provides users with important information about any rights or permissions associated with the dataset.

  ip_restriction_type:
    range: IPRestrictionTypeEnum
    in_subset:
      - governed_use_if_applicable
    description: >-
      The type of intellectual property (IP) restriction that applies to the dataset, if any. 

  agreement_required:
    range: YesNoEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether an agreement (e.g., data use agreement, license agreement, nondisclosure agreement) is required to access or use the dataset.

  agreement_type:
    range: AgreementTypeEnum
    minimum_cardinality: 1
    multivalued: true
    in_subset:
      - situational_required
    description: >-
      The type of agreement required to access or use the dataset.
      Required is `agreement_required` = "Yes".

  public_release_status:
    range: PublicReleaseStatusEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The public release status of the dataset.
  
  record_status:
    range: RecordStatusEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      The record status of the dataset.

  compliance:
    range: ComplianceClass
    inlined: true
    in_subset:
      - governed_use_required
    description: >-
      Populate when release_status = Under_Review | Approved | Published.
      Include with `Unknown` values for Draft datasets 
      Acts as a holder for confirmation of compliance with relevant policies, 
      standards, and requirements for the dataset.

  doe_data_management_plan:
    range: YesNoUnknownNotApplicableEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether the dataset is in compliance with a DOE Data Management Plan (DMP).

  osti_elink2_metadata_compliant:
    range: YesNoUnknownNotApplicableEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether the dataset is compliant with OSTI's E-Link 2.0 metadata requirements.

  irb_approved:
    range: YesNoUnknownNotApplicableEnum
    required: true
    in_subset:
      - governed_use_required
    description: >-
      Whether the dataset has been approved by an Institutional Review Board (IRB).

  citation:
    range: CitationClass
    inlined: true
    in_subset:
      - situational_required
    description: >-
      Citation information for the dataset, if applicable.
      Required when release_status = Approved | Published.
      This can provide users with the necessary information to properly cite 
      the dataset in their work.

  report_number:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Report number or other unique identifier for the dataset.
      This can provide users with an additional identifier for the dataset that can be used 
      in citations and references.
    examples:
      - value: "SAND2024-XXXXX"
      - value: "LAUR-XX-XXXXX"
      - value: "ORNL/TM-2024/XXXXX"

  preferred_citation:
    range: PreferredCitationClass
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Fields that can be used to create full, preferred/recommended citation in bibtex format for the dataset.
      The fields author, title, year, publisher are required if preferred_citation is provided.
      At least one of doi or url must be provided if preferred_citation is provided.
  
  author:
    range: string
    required: true
    in_subset:
      - situational_required
    description: >-
      Author(s) of the dataset, if applicable. 
      author: is intended as a component of a bibtex citation when preferred_citation is provided.
      Required when a preferred_citation is provided.

  title:
    range: string
    required: true
    in_subset:
      - situational_required
    description: >-
      Title of the dataset, if applicable.
      title: is intended as a component of a bibtex citation when preferred_citation is provided.
      Required when a preferred_citation is provided.
      
  year:
    range: string
    pattern: '^\d{4}$'
    required: true
    in_subset:
      - situational_required
    description: >-
      Year of publication or release of the dataset, if applicable.
      year: is intended as a component of a bibtex citation when preferred_citation is provided
      Required when a preferred_citation is provided.
      This can provide users with temporal context for the dataset, which can inform their understanding of its relevance and currency.

  howpublished:
    range: string
    required: false
    in_subset:
      - situational_required
    description: >-
      How the dataset was published or released.
      how_published: is intended as a component of a bibtex citation when preferred_citation is provided
    examples:
      - value: "Online"
      - value: "In Repository"
      - value: "As Supplementary Material"

  publisher:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Publisher or distributing organization for the dataset.
      publisher: is intended as a component of a bibtex citation when preferred_citation is provided
      This can provide users with information about the organization responsible for distributing the dataset.
  
  doi:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Digital Object Identifier (DOI) for the dataset.
      doi: is intended as a component of a bibtex citation when preferred_citation is provided
      Required when a preferred_citation is provided.
      This can provide users with a persistent identifier for the dataset that can be used in citations and references.

  eprinttype:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      The type of eprint identifier provided in the url field.
      eprinttype: is intended as a component of a bibtex citation when preferred_citation is provided.
    examples:
      - value: "arXiv"
      - value: "report_number"
      - value: "pubmed"
      
  eprint:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      The eprint identifier for the dataset.
      Value with correspond to the format of the eprinttype provided (e.g., arXiv, report_number, pubmed).
      eprint: is intended as a component of a bibtex citation when preferred_citation is provided.
    examples:
      - value: "1234.56789"
      - value: "SAND2024-XXXXX"

  note:
    range: string
    required: false
    in_subset:
      - reusability_if_applicable
    description: >-
      Additional notes related to the preferred citation, if any.
      Is intended to align with bibtex "note" field when preferred_citation is provided.
      For legacy bibtex entries that don't accept eprinttype and eprint and
      that need to support an ark or other identifiers that don't fit cleanly into the existing fields, the note field can be used to capture this information in a free-text format.
      include a note: field use this format for the note field: note: Available at ark:/12345/abcde

  ai_usage:
    range: AIUsageClass
    inlined: true
    in_subset:
      - ai_usability_required
    description: >-
      Describes whether and how this dataset may be used in AI/ML workflows.
      Be explicit — these fields are read by automated pipeline tooling.
      This can provide important information about the suitability of the dataset for 
      AI/ML applications and can inform users about any specific considerations or 
      restrictions related to using the dataset in AI/ML workflows. 

  training_use_status:
    range: YesNoConditionalEnum
    in_subset:
      - ai_usability_required
    description: >-
        Whether this dataset can be used for training AI models, based on factors such as data quality, completeness, and relevance.
        Use quotes to distinguish from boolean values.
  
  training_use_conditions:
    range: string
    required: false
    in_subset:
      - situational_required
    description: >-
        If training_use_status is "Conditional", this field is required and 
        describes the specific conditions or restrictions that must be met for the dataset to be used for training AI models.
        This can provide users with important information about any limitations or considerations 
        they should be aware of when using the dataset for training AI models.
  
  inference_use_status:
    range: YesNoConditionalEnum
    in_subset:
      - ai_usability_required
    description: >-
        Whether this dataset can be used for inference with AI models, 
        based on factors such as data quality, completeness, and relevance.
        Use quotes to distinguish from boolean values.
  
  inference_use_conditions:
    range: string
    required: false
    in_subset:
      - situational_required
    description: >-
        If inference_use_status is "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for inference with AI models.
        This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for inference with AI models.

  evaluation_use_status:
    range: YesNoConditionalEnum
    in_subset:
      - ai_usability_required
    description: >-
        Whether this dataset can be used for evaluation of AI models, based on factors such as data quality, completeness, and relevance.
        Use quotes to distinguish from boolean values.
  
  evaluation_use_conditions:
    range: string
    required: false
    in_subset:
      - situational_required
    description: >-
        If evaluation_use_status is "Conditional", this field is required and describes the specific conditions or restrictions that must be met for the dataset to be used for evaluation of AI models.
        This can provide users with important information about any limitations or considerations they should be aware of when using the dataset for evaluation of AI models.

  restrictions:
    range: string
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Any specific restrictions or conditions related to using this dataset in AI/ML workflows, if applicable.
      Be explicit if there are no applicable restrictions (e.g., "not_applicable") rather than leaving this field blank.
      This can provide users with important information about any limitations or considerations they should be aware of when using the dataset in AI/ML applications.
    related_mappings:
      - fair4ml:modelRisksBiasLimitations
    examples:
      - value: "Not for clinical decision-making"
      - value: "Dataset is intended for research purposes only and should not be used for commercial applications."
      - value: "Dataset is subject to data use agreement restrictions that limit its use to non-commercial research purposes."
      - value: "not_applicable"

  bias_risks:
    range: string
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Any known or potential bias risks associated with using this dataset in AI/ML workflows.
      Be explicit if there are no known or potential bias risks (e.g., "not_applicable") rather than leaving this field blank.
    related_mappings:
      - fair4ml:modelRisksBiasLimitations
      - fair4ml:ethicalSocial
    examples:
      - value: "Dataset is predominantly from one demographic group, which may introduce bias in AI models trained on this data."
      - value: "Overrepresents samples from facility X, which may lead to biased model performance."
      - value: "not_applicable"

  safety_considerations:
    range: string
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Any known or potential safety considerations associated with using this dataset in AI/ML workflows.
      Be explicit if there are no known or potential safety considerations (e.g., "not_applicable") rather than leaving this field blank.
    related_mappings:
      - fair4ml:modelRisksBiasLimitations
    examples:
      - value: "Contains personally identifiable information (PII) that could pose privacy risks if not handled properly."
      - value: "Dataset includes sensitive information that could be misused if not properly safeguarded."
      - value: "not_applicable"

  human_review_required:
    range: YesNoEnum
    required: true
    in_subset:
      - ai_usability_required
    description: >-
      Whether human review is recommended when using this dataset in AI/ML workflows, 
      based on factors such as data quality, completeness, relevance, and any known risks or considerations.
      This can provide users with guidance on whether they should incorporate human review 
      into their AI/ML workflows when working with this dataset, 
      which can help mitigate potential risks and ensure responsible use of the data.

  data_quality:
    range: DataQualityClass
    inlined: true
    in_subset:
      - reusability_required
    description: >-
      Provides information about the quality of the dataset,
      including any known issues, limitations, or uncertainties that may affect its suitability for AI/ML applications.

  completeness:
    range: string
    required: true
    in_subset:
      - reusability_required
    description: >-
      Information about the completeness of the dataset, including any known gaps, missing values, 
      or limitations in the data that may affect its suitability for use.
    examples:
      - value: "All detector channels present; 2% of timesteps missing"
      - value: "Missing due to sensor downtime for 5% of samples"
      - value: "Dataset is complete with no known gaps or missing values"
      - value: "not_applicable"

  known_issues:
    range: string
    required: true
    in_subset:
      - reusability_required
    description: >-
      Any known issues or limitations with the dataset that may affect its suitability for use.
      Be explicit if there are no known issues or limitations (e.g., "not_applicable") rather than leaving this field blank.
    examples:
      - value: "Sensor drift observed after 2023-06-01T12:00:00Z"
      - value: "Sensor calibration drift affects accuracy of measurements after June 2023"
      - value: "Data from Facility X may have quality issues due to known equipment problems during the data collection period"
      - value: "not_applicable"

  validation_methods:
    range: string
    required: true
    in_subset:
      - reusability_required
    description: >-
      Information about any validation methods or processes that have been applied to the dataset to assess its quality and suitability for use.
      Be explicit if there are no validation methods or processes (e.g., "not_applicable") rather than leaving this field blank.
    examples:
      - value: "Cross-validated against NIST SRM 640f"
      - value: "Dataset validated against ground truth measurements from Facility Y"
      - value: "Data quality assessed using method Z with the following results: ..."
      - value: "not_applicable"

  noise_characteristics:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the noise characteristics of the dataset.
      Be explicit if there are no known noise issues or characteristics (e.g., "not_applicable") 
      rather than leaving this field blank.
    examples:
      - value: "Signal-to-noise ratio (SNR) of 20 dB across all channels"
      - value: "Noise level increases by 5% after June 2023 due to equipment degradation"
      - value: "Dataset has low noise levels with no known issues"
      - value: "not_applicable"
  
  uncertainty_notes:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Any known uncertainties or limitations in the dataset that may affect its suitability for use.
      Be explicit if there are no known uncertainties or limitations (e.g., "not_applicable") 
      rather than leaving this field blank.
    examples:
      - value: "Measurement uncertainty ±0.5% (k=2) per ISO/IEC Guide 98-3"
      - value: "Uncertainty increases to ±10% for measurements taken after June 2023 due to equipment degradation"
      - value: "Dataset has low uncertainty with no known issues"
      - value: "not_applicable"
  
  missing_data_codes:
    range: MissingDataCodesClass
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - reusability_if_applicable
    description: >-
      If the dataset contains missing values, list the missing codes and their meanings. 
      This can provide users with important information about how missing data is represented in the dataset, 
      which can inform their decisions about how to handle missing values when used.
    examples:
      - value: "code: -9999; description: Indicates sensor failure"
      - value: "code: -8888; description: Indicates data not collected"
      - value: "code: -7777; description: Indicates value below detection limit"
      - value: "code: NULL; description: Indicates missing value"

  code:
    range: string
    identifier: true
    in_subset:
      - reusability_if_applicable
    description: >-
      A placeholder slot for any code or script associated with the dataset, 
      such as data processing scripts, analysis code, or code used to generate the dataset.
      This can provide users with access to code that is relevant to understanding and using the dataset effectively.
    examples:
      - value: "-9999"
      - value: "NULL"

  integrity:
    range: IntegrityClass
    inlined: true
    in_subset:
      - reusability_required
    description: >-
      Contains elements describing checksums enable automated validation of data integrity after transfer or storage.

  checksum_available:
    range: YesNoEnum
    in_subset:
      - reusability_if_applicable
    description: >-
      Whether a checksum is available for this dataset, 
      which can be used to verify the integrity of the data after transfer or storage.

  checksum_type:
    range: string
    in_subset:
      - situational_required
    description: >-
      The type of checksum available for this dataset.
      Required if checksum_available="Yes".
      This can provide users with information about the method used to generate the checksum, 
      which can inform their decisions about how to use the checksum for data integrity verification.
    close_mappings:
      - spdx:algorithm
  
  checksum_value:
    range: string
    in_subset:
      - situational_required
    description: >-
      The value of the checksum for this dataset, if applicable.
      Required if checksum_available="Yes".
      This can be used by users to verify the integrity of the data after 
      transfer or storage by comparing the provided checksum value with a newly 
      generated checksum from the transferred or stored data.
    exact_mappings:
      - spdx:checksumValue
  
  fixity_policy:
    range: string
    in_subset:
      - reusability_if_applicable
    description: >-
      Information about the fixity policy for this dataset, 
      including how often fixity checks are performed and any specific procedures 
      or tools used for fixity verification.
    examples:
      - value: "Monthly sha256 verification via repository integrity service"

  semantic_layer:
    range: SemanticLayerClass
    inlined: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      Required for federated or cross-domain use.
      Populate schema_url at minimum.
      Contains elements to provide a machine-readable semantic layer for the dataset.
    
  schema_url:
    range: string
    in_subset:
      - interoperability_if_applicable
    description: >-
      URL pointing to the schema or ontology that defines the semantic layer for this dataset.
      URL to a formal schema for this dataset, e.g., URL to a JSON Schema | XML Schema | NeXus application definition
      "not_applicable" if there is no formal schema or ontology for this dataset.
      Be explicit if there is no formal schema or ontology (e.g., "not_applicable") rather than leaving this field blank.
      This can provide users with access to the formal definitions and relationships that underpin the dataset's semantic layer.
    examples:
      - value: "https://example.com/schema/dataset_semantic_layer.json"
      - value: "https://example.com/ontology/dataset_semantic_layer.owl"
      - value: "not_applicable"

  semantic_context:
    range: string
    multivalued: true
    in_subset:
      - interoperability_if_applicable
    description: >-
      A human-readable description of the semantic context and structure of the dataset.
      Semantic conventions applied.
      This can provide users with important information about the meaning and relationships 
      of the data elements within the dataset, 
      which can inform their understanding and use of the dataset for AI/ML applications.
    examples:
      - value: "NetCDF CF Conventions 1.10"
      - value: "NeXus NXmonopd"
      - value: "Custom schema with the following key classes and relationships: ..."

  any_value:
      range: AnyValue
      description: "A placeholder slot that can be used when the value can be of any type or is not known in advance."