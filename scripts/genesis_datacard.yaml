      Ad_Hoc:
        description: "The dataset is updated on an ad hoc basis, without a regular schedule."
      Monthly:
        description: "The dataset is updated on a monthly basis."
      Quarterly:
        description: "The dataset is updated on a quarterly basis."
      Annually:
        description: "The dataset is updated on an annual basis."
      Continuously:
        description: "The dataset is updated continuously, with new data added as it becomes available."
      Other:
        description: "Other update frequency."

  FundingSourceEnum:
    description: "Controlled vocabulary for the funding source of the dataset."
    permissible_values:
      DOE_Program_SC:
        description: "U.S. Department of Energy (DOE) - Office of Science"
      DOE_Program_NNSA:
        description: "U.S. Department of Energy (DOE) - National Nuclear Security Administration"
      LDRD:
        description: "Laboratory Directed Research and Development (LDRD) funding"
      WFO:
        description: "Work for Others (WFO) funding from a non-DOE entity"
      CRADA:
        description: "Cooperative Research and Development Agreement (CRADA) funding from a non-DOE entity"
      Other_Federal:
        description: "Other federal government funding source (e.g., NSF, NIH, DOD)"
      State_Government:
        description: "State government funding source"
      Subcontract:
        description: "Subcontract funding from a prime contractor"
      Industry:
        description: "Industry or commercial entity"
      Nonprofit:
        description: "Nonprofit organization or foundation"
      Internal:
        description: "Internal project or institutional funding"
      Other:
        description: "Other funding source not covered by the above categories"

  IntendedPartnerClassEnum:
    description: >-
      Controlled vocabulary for the intended partner class for sharing datasets.
