          National Security Information datasets, including data related to national defense, intelligence, and security operations.
          Can include Top Secret, Secret, and Confidential information that is not related to nuclear weapons or materials.
      RD:
        description: >-
          Comprises all data related to: the design, manufacture, or use of nuclear weapons; 
          production of special nuclear material (SNM); or use of SNM in the production of energy. 
      FRD:
        description: >-
          Formerly Restricted Data datasets, still a category of classified information related to nuclear weapons. 
